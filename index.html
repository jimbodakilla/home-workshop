<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workshop">
<meta name="theme-color" content="#F3F6F2">
<meta name="description" content="A small daily workshop for a young child: read, build, explain and play with numbers.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%232FB8A6' stroke='%2314221E' stroke-width='4'/%3E%3Ccircle cx='24' cy='30' r='7' fill='white' stroke='%2314221E' stroke-width='3'/%3E%3Ccircle cx='42' cy='30' r='7' fill='white' stroke='%2314221E' stroke-width='3'/%3E%3Cpath d='M22 43q10 8 20 0' fill='none' stroke='%2314221E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Home Workshop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a sticker-book workshop. A robot helper greets the child, four
   illustrated stations sit in a 2x2 grid, and every station is pick-one-of-three,
   then one how-to with one big button. Chunky outlines and hard offset shadows
   make every target look pressable. Grown-up tools hide behind a press-and-hold gate. */
:root{
  --bg:#F3F6F2; --card:#FFFFFF; --sunk:#E5EBE6;
  --ink:#14221E; --ink2:#43524C; --ink3:#55635D; --line:#D3DCD7;
  --edge:#14221E; --sh:#14221E;
  --btn:#1B5E52; --btn-ink:#FFFFFF;
  --star:#F2B600; --star-line:#14221E;
  --read:#2F63B5;    --read-w:#E3EDFB;
  --build:#8F5C0E;   --build-w:#FBEBCF;
  --explain:#25704F; --explain-w:#DDF3E8;
  --nums:#7446AE;    --nums-w:#EDE3F8;
  --ff-d:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --ff-b:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --card:#17211E; --sunk:#1D2927;
  --ink:#E9F1ED; --ink2:#A9B7B0; --ink3:#8898A1; --line:#2B3834;
  --edge:#5E7A70; --sh:#050908;
  --btn:#6FCB9C; --btn-ink:#0B1F17;
  --star:#F4C020; --star-line:#14221E;
  --read:#8DB3EC;    --read-w:#16233A;
  --build:#E3A951;   --build-w:#2B2112;
  --explain:#74CFA0; --explain-w:#14281F;
  --nums:#BE9FEA;    --nums-w:#241B33;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1715; --card:#17211E; --sunk:#1D2927;
  --ink:#E9F1ED; --ink2:#A9B7B0; --ink3:#8898A1; --line:#2B3834;
  --edge:#5E7A70; --sh:#050908;
  --btn:#6FCB9C; --btn-ink:#0B1F17;
  --star:#F4C020; --star-line:#14221E;
  --read:#8DB3EC;    --read-w:#16233A;
  --build:#E3A951;   --build-w:#2B2112;
  --explain:#74CFA0; --explain-w:#14281F;
  --nums:#BE9FEA;    --nums-w:#241B33;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:18px;line-height:1.55;
  -webkit-text-size-adjust:100%}
.app{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:22px 60px}
h1,h2,h3{font-family:var(--ff-d);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1:focus,h2:focus{outline:none}
h2{font-size:clamp(28px,6.5vw,38px);font-weight:800;line-height:1.08}
h3{font-size:22px;font-weight:600;line-height:1.2}
p{margin:0 0 12px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--btn);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* sticker = anything the child can press */
.sticker{border:3px solid var(--edge);box-shadow:0 6px 0 var(--sh);border-radius:22px;
  transition:transform .08s,box-shadow .08s}
.sticker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}

/* ---- helper + speech bubble ---- */
.hello{display:flex;gap:14px;align-items:center}
.hello .mas{flex:none;display:flex;flex-direction:column;align-items:center}
.nametag{font-family:var(--ff-d);font-weight:600;font-size:16px;color:var(--ink2);margin-top:2px}
.bubble{position:relative;flex:1 1 auto;min-width:0;background:var(--card);border:3px solid var(--edge);
  border-radius:22px;padding:14px 18px;box-shadow:0 5px 0 var(--sh);
  font-family:var(--ff-d);font-weight:600;font-size:clamp(20px,4.6vw,26px);line-height:1.25}
.bubble::before{content:"";position:absolute;left:-13px;top:34px;width:20px;height:20px;background:var(--card);
  border-left:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:rotate(45deg)}
.topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.mini{background:none;border:0;color:var(--ink3);font-size:15px;padding:8px 10px;min-height:44px;
  display:inline-flex;gap:6px;align-items:center}
.warn{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--build-w);border:2.5px solid var(--build);
  font-size:16px;color:var(--ink)}

/* ---- chest + treasure ---- */
.week{margin-top:22px;display:flex;gap:16px;align-items:center;padding:16px 18px;background:var(--card)}
.week .tx{flex:1;min-width:0}
.week b{font-family:var(--ff-d);font-weight:600;font-size:20px;display:block;line-height:1.2}
.week small{color:var(--ink2);font-size:16px}
.bar{height:14px;border-radius:99px;background:var(--sunk);margin-top:10px;overflow:hidden;border:2px solid var(--edge)}
.bar i{display:block;width:100%;height:100%;background:var(--star);transform-origin:left;transition:transform .4s}

/* ---- stations ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:20px;margin-top:26px}
.st{position:relative;display:flex;gap:14px;align-items:center;text-align:left;padding:16px 16px 16px 14px;
  min-height:128px;background:var(--w);color:var(--ink)}
.st .ic{flex:none;width:72px;height:72px}
.st .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.st .nm{font-family:var(--ff-d);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.st .tg{font-size:17px;color:var(--ink2);line-height:1.3}
.st .mn{font-size:15px;color:var(--ink3);margin-top:3px}
.st.done{background:var(--card)}
.st.done .nm{color:var(--ink3)}
.st .badge{position:absolute;top:-13px;right:14px;background:var(--star);color:#14221E;font-family:var(--ff-d);
  font-weight:800;font-size:15px;padding:4px 12px;border-radius:99px;border:3px solid var(--edge)}
.st .tick{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:700;font-size:16px}
.endday{margin-top:26px;padding:18px;background:var(--explain-w);text-align:center;
  font-family:var(--ff-d);font-weight:800;font-size:24px;line-height:1.2}
.gate{display:block;margin:38px auto 0;background:none;border:2px dashed var(--line);color:var(--ink3);
  padding:10px 20px;border-radius:99px;font-size:15px;min-height:46px;user-select:none;-webkit-user-select:none;touch-action:none}
.gate[data-hold="1"]{border-style:solid;border-color:var(--btn);color:var(--ink)}

/* ---- welcome ---- */
.welcome{margin-top:20px;padding:20px;background:var(--card)}
.welcome label{display:block;font-family:var(--ff-d);font-weight:600;font-size:22px;margin-top:18px}
.welcome label:first-of-type{margin-top:4px}
.welcome input[type=text]{width:100%;margin-top:8px;font-family:inherit;font-size:20px;padding:12px 14px;min-height:54px;
  border-radius:14px;border:3px solid var(--line);background:var(--sunk);color:var(--ink)}
.welcome input:focus{outline:none;border-color:var(--btn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{padding:8px 16px;min-height:44px;border-radius:99px;background:var(--card);border:2.5px solid var(--edge);
  font-size:17px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.chip.static{background:var(--read-w);border-color:var(--read);min-height:0;padding:5px 14px}
.chip.rm{display:inline-flex;align-items:center;gap:8px;background:var(--read-w);border-color:var(--read);min-height:44px;padding:4px 8px 4px 14px;font-size:16px}
.chip.rm b{font-weight:700;font-size:20px;line-height:1;padding:0 6px}

/* ---- station screen ---- */
.back{background:none;border:0;color:var(--ink2);padding:10px 4px;min-height:46px;font-size:18px}
.sthead{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.sthead .ic{width:64px;height:64px;flex:none}
.sthead h2{color:var(--c)}
.pick{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;min-height:78px;background:var(--card);color:var(--ink)}
.opt b{font-family:var(--ff-d);font-size:23px;font-weight:600;display:block;line-height:1.2}
.opt span{color:var(--ink2);font-size:17px;display:block;margin-top:3px}
.how{margin-top:20px;padding:20px;background:var(--w)}
.how ol{margin:14px 0 0;padding-left:0;list-style:none;counter-reset:n}
.how li{counter-increment:n;position:relative;padding:9px 0 9px 50px;font-size:21px;line-height:1.5}
.how li::before{content:counter(n);position:absolute;left:0;top:8px;width:34px;height:34px;border-radius:50%;
  background:var(--c);color:var(--bg);font-family:var(--ff-d);font-weight:800;font-size:19px;
  display:flex;align-items:center;justify-content:center}
.need{margin-top:8px;color:var(--ink2);font-size:17px}
.twist{margin:12px 0 0;color:var(--ink2);font-size:17px}
.twist b{color:var(--ink)}
.stretch{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--card);border:2.5px dashed var(--edge);font-size:18px}
.btn{font-family:var(--ff-d);font-weight:800;font-size:24px;padding:16px 30px;min-height:64px;border-radius:99px;
  background:var(--btn);color:var(--btn-ink);border:3px solid var(--edge);box-shadow:0 6px 0 var(--sh)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.btn.sm{font-family:var(--ff-b);font-weight:700;font-size:17px;padding:10px 18px;min-height:50px;box-shadow:0 4px 0 var(--sh)}
.btn.alt{background:var(--card);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:16px 14px;align-items:center;margin-top:24px}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;padding:12px 6px;min-height:46px;font-size:17px}
.ico{display:inline-flex;align-items:center;gap:8px}
.timer{display:flex;gap:14px;align-items:center;margin-top:16px}
.timer svg{width:74px;height:74px}
.timer .t{font-family:var(--ff-d);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.earned{margin-top:18px;padding:22px;background:var(--card);text-align:center}
.earned .big{display:flex;justify-content:center;margin-bottom:6px}
.earned .big svg{width:76px;height:76px;animation:pop .55s ease-out}
.wig{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:18px;color:var(--ink2)}
.wig b{color:var(--ink)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.jar{margin-top:34px;padding:18px;background:var(--card)}
.jar form{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.jar input[type=text]{flex:1 1 180px;min-width:0;font-family:inherit;font-size:20px;padding:12px 14px;min-height:54px;
  border-radius:14px;border:3px solid var(--line);background:var(--sunk);color:var(--ink)}
.jar input:focus{outline:none;border-color:var(--read)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-16px;width:10px;height:15px;border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(560deg)}}

/* ---- grown-ups ---- */
.g h3{margin:32px 0 8px}
.g p,.g li{color:var(--ink2);font-size:16.5px;max-width:64ch}
.g ul{padding-left:20px;margin:8px 0 0}
.g li{margin-bottom:6px}
.note{padding:14px 16px;border-radius:14px;background:var(--sunk);font-size:16px;color:var(--ink2);margin-top:14px}
.note b{color:var(--ink)}
.note.ok{background:var(--explain-w);border:2.5px solid var(--explain);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px;font-size:15.5px;color:var(--ink2)}
.field input,.field textarea{font-family:inherit;font-size:17px;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:46px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 16px}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{border-collapse:collapse;width:100%;min-width:340px;font-size:15.5px}
.tbl td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.tbl td b{color:var(--ink)}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on.read{background:var(--read);border-color:var(--read)}
.dots i.on.build{background:var(--build);border-color:var(--build)}
.dots i.on.explain{background:var(--explain);border-color:var(--explain)}
.dots i.on.nums{background:var(--nums);border-color:var(--nums)}
.sample{padding:12px 0;border-bottom:1px solid var(--line)}
.sample b{color:var(--ink);font-size:16px}
.sample div{font-size:16px;color:var(--ink2)}
.letter{white-space:pre-wrap;background:var(--sunk);padding:14px 16px;border-radius:12px;font-size:15.5px;
  color:var(--ink);line-height:1.6;margin-top:10px;overflow-x:auto}
.said{color:var(--btn);font-weight:700;font-size:15.5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:460px){.hello .mas svg{width:92px;height:auto}.st .ic{width:60px;height:60px}.st .nm{font-size:27px}}
</style>

<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <main id="home" class="view"></main>
  <main id="station" class="view" hidden></main>
  <main id="grown" class="view g" hidden></main>
</div>

<script>
/* ---------- saved data: survives a browser that will not save ---------- */
var KEYS={welcomed:false,child:"",name:"",interest:"",parent:"",maths:"",evalDate:"",reward:"Weekend treat",
          goal:12,mute:false,days:{},words:[],samples:[],claimed:0};
var MEM={},storageOK=true;
try{localStorage.setItem("lw__t","1");localStorage.removeItem("lw__t");}catch(e){storageOK=false;}
/* data of the wrong shape falls back to the default instead of crashing the page */
function fit(v,d){
  if(Array.isArray(d))return Array.isArray(v)?v:d;
  if(d!==null&&typeof d==="object")return (v&&typeof v==="object"&&!Array.isArray(v))?v:d;
  if(typeof d==="number")return (typeof v==="number"&&isFinite(v))?v:d;
  if(typeof d==="string")return typeof v==="string"?v:d;
  if(typeof d==="boolean")return typeof v==="boolean"?v:d;
  return v;
}
var store={
  get:function(k,d){
    var v;
    if(k in MEM)v=MEM[k];
    else{try{var r=localStorage.getItem("lw_"+k);v=r===null?d:JSON.parse(r);}catch(e){storageOK=false;v=d;}}
    return fit(v,d);
  },
  set:function(k,v){MEM[k]=v;try{localStorage.setItem("lw_"+k,JSON.stringify(v));}catch(e){storageOK=false;}}
};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return (n<10?"0":"")+n;}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function dayNum(key){var p=String(key).split("-").map(Number);return Math.floor(Date.UTC(p[0],p[1]-1,p[2])/864e5);}
function keyOf(n){var d=new Date(n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());}
function dlabel(n){return new Date(n*864e5).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});}
function helper(){return store.get("name","")||"Bolt";}

/* ---------- artwork ---------- */
var OUT="#14221E";
var LN='stroke="'+OUT+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
function iconSvg(id){
  if(id==="read")return '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M7 13h21c3 0 4 2 4 4v35c0-2-1-4-4-4H7z" fill="#8FB6F0" '+LN+'/><path d="M57 13H36c-3 0-4 2-4 4v35c0-2 1-4 4-4h21z" fill="#C6DAF8" '+LN+'/><path d="M13 23h13M13 30h13M38 23h13M38 30h13" fill="none" '+LN+'/><path d="M32 6l2 4 4.4.6-3.2 3 .8 4.4-4-2.1-4 2.1.8-4.4-3.2-3L30 10z" fill="#FFD84A" '+LN+'/></svg>';
  if(id==="build")return '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="38" width="52" height="19" rx="4" fill="#F7B955" '+LN+'/><rect x="12" y="22" width="38" height="16" rx="4" fill="#F28B6B" '+LN+'/><rect x="20" y="8" width="24" height="14" rx="4" fill="#8FD3B6" '+LN+'/><circle cx="18" cy="47" r="3" fill="'+OUT+'"/><circle cx="32" cy="47" r="3" fill="'+OUT+'"/><circle cx="46" cy="47" r="3" fill="'+OUT+'"/></svg>';
  if(id==="explain")return '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 8h40c4 0 7 3 7 7v22c0 4-3 7-7 7H30l-12 10v-10h-6c-4 0-7-3-7-7V15c0-4 3-7 7-7z" fill="#A5E3C8" '+LN+'/><circle cx="32" cy="23" r="9" fill="#FFE27A" '+LN+'/><path d="M28 33h8v4h-8z" fill="#C9C9C9" '+LN+'/></svg>';
  if(id==="nums")return '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="7" width="50" height="50" rx="11" fill="#D6BFF5" '+LN+'/><g fill="'+OUT+'"><circle cx="22" cy="20" r="4"/><circle cx="42" cy="20" r="4"/><circle cx="22" cy="32" r="4"/><circle cx="42" cy="32" r="4"/><circle cx="22" cy="44" r="4"/><circle cx="42" cy="44" r="4"/></g></svg>';
  return "";
}
function starSvg(on){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5 6.2 20.6l1.1-6.5L2.6 9.5l6.5-.9z" fill="'+(on?'#FFD23F':'none')+'" stroke="'+OUT+'" stroke-width="1.8" stroke-linejoin="round"/></svg>';
}
function tickSvg(){return '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function speakerSvg(){return '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9z" fill="currentColor"/><path d="M16 8.5c1.6 1.6 1.6 5.4 0 7M18.5 6c3 3 3 9 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';}
function diceSvg(){return '<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/><g fill="currentColor"><circle cx="8.5" cy="8.5" r="1.7"/><circle cx="15.5" cy="15.5" r="1.7"/><circle cx="15.5" cy="8.5" r="1.7"/><circle cx="8.5" cy="15.5" r="1.7"/></g></svg>';}

/* his own interest becomes one of the three choices on alternate days */
function custom(id,it){
  if(id==="read")return {t:"Facts about "+it,s:["Find a book or a short video about "+it+" with a grown-up.","Pick one fact that surprised you and tell it to someone."]};
  if(id==="build")return {t:"Make something about "+it,s:["Use blocks, paper, clay or anything you like to make something about "+it+".","Tell a grown-up how it works, or what it does."]};
  if(id==="explain")return {t:"Teach it: "+it,s:["Pick one thing about "+it+" that you want to find out.","Find out with a grown-up, then draw it and teach it back."]};
  return {t:"Number stories: "+it,s:["Make up a number story about "+it+" that needs two steps to solve.","A grown-up solves it. Check their answer."]};
}
/* a seeded shuffle per cycle: every activity appears once per cycle, in a different
   order each time, so the same three choices never come back day after day */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function perm(n,seed){var a=[],i,r=rng(seed);for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function choices(si,key){
  var s=ST[si],bank=s.bank,n=bank.length,per=Math.ceil(n/3),dn=dayNum(key),cyc=Math.floor(dn/per),j=dn-cyc*per,
      p=perm(n,cyc*7919+si*104729+13),out=[],t;
  for(t=0;t<3;t++)out.push(bank[p[(j*3+t)%n]]);
  var it=store.get("interest","");
  if(it&&dn%2===0){
    var c=custom(s.id,it),idx=-1,i;
    for(i=0;i<out.length;i++)if(c.t.indexOf(out[i].t)===0){idx=i;break;}
    out[idx<0?0:idx]=c;
  }
  return out;
}
function twistFor(si,key){return TWISTS[(dayNum(key)+si*5)%TWISTS.length].replace("{h}",helper());}

function days(){return store.get("days",{});}
function doneOn(key,id){var d=days()[key],v=d&&typeof d==="object"?d[id]:null;return v?{t:String((v&&v.t)||"Done")}:null;}
function countOn(key){var n=0;ST.forEach(function(s){if(doneOn(key,s.id))n++;});return n;}
function easy(){
  var ev=store.get("evalDate","");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ev))return {easy:false,rest:false};
  var left=dayNum(ev)-dayNum(todayKey());
  return {easy:left>=0&&left<=7,rest:left>=0&&left<=1};
}
function dayComplete(){var k=todayKey();return easy().easy?!!doneOn(k,"read"):countOn(k)>=3;}
/* stars count toward the treasure until a grown-up hands it over, so it is never taken back */
function totalStars(){var all=days(),n=0,k;for(k in all)n+=countOn(k);return n;}
function treasureStars(){return Math.max(0,totalStars()-store.get("claimed",0));}

/* ---------- sound, speech, confetti ---------- */
var AC=null;
function unlockAudio(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended"&&AC.resume)AC.resume();
  }catch(e){}
}
/* iPad keeps audio locked until a tap, so unlock on the first one */
document.addEventListener("pointerdown",unlockAudio,{passive:true});
document.addEventListener("click",unlockAudio,{passive:true});
function chime(){
  if(store.get("mute",false))return;
  try{
    unlockAudio();if(!AC)return;
    var t=AC.currentTime;
    [[660,0],[880,.12],[1175,.24]].forEach(function(n){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type="sine";o.frequency.value=n[0];
      g.gain.setValueAtTime(0,t+n[1]);g.gain.linearRampToValueAtTime(.16,t+n[1]+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+n[1]+.4);
      o.connect(g);g.connect(AC.destination);o.start(t+n[1]);o.stop(t+n[1]+.45);
    });
  }catch(e){}
}
var canSpeak=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
function say(text){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.rate=.95;speechSynthesis.speak(u);}catch(e){}
}
function quiet(){if(canSpeak){try{speechSynthesis.cancel();}catch(e){}}}
function burst(count){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var box=document.createElement("div"),cols=["#F28B6B","#F7B955","#8FD3B6","#8FB6F0","#C6A4F0"],i;
  box.className="confetti";
  for(i=0;i<(count||30);i++){
    var p=document.createElement("i");
    p.style.left=(8+Math.random()*84)+"%";p.style.background=cols[i%5];
    p.style.animationDelay=(Math.random()*.3)+"s";p.style.setProperty("--dx",(Math.random()*180-90)+"px");
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(function(){if(box.parentNode)box.parentNode.removeChild(box);},2400);
}

/* ---------- visual timer: opt-in, based on the clock so a sleeping iPad cannot skew it ---------- */
var timer={h:null,end:0,total:0,left:0};
function stopTimer(){if(timer.h){clearInterval(timer.h);timer.h=null;}timer.left=0;timer.total=0;timer.end=0;}
function paintTimer(){
  var box=document.getElementById("timerBox");if(!box)return;
  if(!timer.total){box.innerHTML="";return;}
  var C=2*Math.PI*30,frac=timer.left/timer.total,m=Math.floor(timer.left/60),s=timer.left%60;
  box.innerHTML='<div class="timer"><svg viewBox="0 0 74 74" aria-hidden="true"><circle cx="37" cy="37" r="30" fill="none" stroke="var(--sunk)" stroke-width="9"/>'+
    '<circle cx="37" cy="37" r="30" fill="none" stroke="var(--c)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-frac)).toFixed(1)+'" transform="rotate(-90 37 37)"/></svg>'+
    '<div><div class="t">'+(timer.left>0?m+":"+pad(s):"Time!")+'</div><div style="color:var(--ink2);font-size:16px">'+
    (timer.left>0?"Just a way to see the time.":"Keep going if you are having fun.")+'</div></div></div>';
}
function tickTimer(){
  timer.left=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  if(timer.left<=0&&timer.h){clearInterval(timer.h);timer.h=null;chime();}
  paintTimer();
}
function startTimer(min){
  stopTimer();timer.total=min*60;timer.end=Date.now()+timer.total*1000;
  tickTimer();timer.h=setInterval(tickTimer,1000);
}

var holdT=null;
function bindGate(){
  var g=document.getElementById("gate");if(!g)return;
  function start(){g.setAttribute("data-hold","1");g.textContent="keep holding...";
    holdT=setTimeout(function(){g.removeAttribute("data-hold");stopTimer();quiet();renderGrown();show("grown");},1800);}
  function stop(){clearTimeout(holdT);g.removeAttribute("data-hold");g.textContent="for grown-ups";}
  g.addEventListener("pointerdown",start);
  g.addEventListener("pointerup",stop);g.addEventListener("pointerleave",stop);g.addEventListener("pointercancel",stop);
  g.addEventListener("keydown",function(ev){if((ev.key==="Enter"||ev.key===" ")&&!ev.repeat){ev.preventDefault();start();}});
  g.addEventListener("keyup",stop);
}

    copyText(text,document.getElementById("sSaid"),document.getElementById("sFb"));
  });
  document.getElementById("tCopy").addEventListener("click",function(){
    copyText(teacherText(),document.getElementById("tSaid"),document.getElementById("tFb"));
  });
  document.getElementById("bkCopy").addEventListener("click",function(){
    copyText(backupText(),document.getElementById("bkSaid"),document.getElementById("bkFb"));
  });
  document.getElementById("rsGo").addEventListener("click",function(){
    var ok=restoreFrom(document.getElementById("rsText").value.trim());
    if(ok){renderGrown();document.getElementById("rsMsg").textContent="Restored.";}
    else document.getElementById("rsMsg").textContent="That does not look like a backup from this page.";
  });
}

renderHome();
</script>
