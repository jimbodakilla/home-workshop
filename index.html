<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workshop">
<meta name="theme-color" content="#F3F6F2">
<meta name="description" content="A small daily workshop for a young child: read, build, explain and play with numbers.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%232FB8A6' stroke='%2314221E' stroke-width='4'/%3E%3Ccircle cx='24' cy='30' r='7' fill='white' stroke='%2314221E' stroke-width='3'/%3E%3Ccircle cx='42' cy='30' r='7' fill='white' stroke='%2314221E' stroke-width='3'/%3E%3Cpath d='M22 43q10 8 20 0' fill='none' stroke='%2314221E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Home Workshop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a sticker-book workshop. A robot helper stands on a pegboard wall with
   today's star tray under it, four illustrated stations sit in a 2x2 grid, and every
   station is pick-one-of-three, then one how-to with tap-to-tick steps and one big
   button. Chunky outlines and hard offset shadows make every target look pressable;
   motion is slow and sparing, and switches off for reduced-motion settings. */
:root{
  --bg:#F3F6F2; --card:#FFFFFF; --sunk:#E5EBE6;
  --ink:#14221E; --ink2:#43524C; --ink3:#55635D; --line:#D3DCD7;
  --edge:#14221E; --sh:#14221E;
  --btn:#1B5E52; --btn-ink:#FFFFFF;
  --hero:#DCEFEA; --dot:rgba(20,34,30,.13);
  --star:#F2B600; --star-line:#14221E;
  --read:#2F63B5;    --read-w:#E3EDFB;
  --build:#8F5C0E;   --build-w:#FBEBCF;
  --explain:#25704F; --explain-w:#DDF3E8;
  --nums:#7446AE;    --nums-w:#EDE3F8;
  --ff-d:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --ff-b:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --card:#17211E; --sunk:#1D2927;
  --ink:#E9F1ED; --ink2:#A9B7B0; --ink3:#8898A1; --line:#2B3834;
  --edge:#5E7A70; --sh:#050908;
  --btn:#6FCB9C; --btn-ink:#0B1F17;
  --hero:#13262A; --dot:rgba(255,255,255,.08);
  --star:#F4C020; --star-line:#14221E;
  --read:#8DB3EC;    --read-w:#16233A;
  --build:#E3A951;   --build-w:#2B2112;
  --explain:#74CFA0; --explain-w:#14281F;
  --nums:#BE9FEA;    --nums-w:#241B33;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1715; --card:#17211E; --sunk:#1D2927;
  --ink:#E9F1ED; --ink2:#A9B7B0; --ink3:#8898A1; --line:#2B3834;
  --edge:#5E7A70; --sh:#050908;
  --btn:#6FCB9C; --btn-ink:#0B1F17;
  --hero:#13262A; --dot:rgba(255,255,255,.08);
  --star:#F4C020; --star-line:#14221E;
  --read:#8DB3EC;    --read-w:#16233A;
  --build:#E3A951;   --build-w:#2B2112;
  --explain:#74CFA0; --explain-w:#14281F;
  --nums:#BE9FEA;    --nums-w:#241B33;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:18px;line-height:1.55;
  -webkit-text-size-adjust:100%}
.app{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:18px 60px}
h1,h2,h3{font-family:var(--ff-d);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1:focus,h2:focus{outline:none}
h2{font-size:clamp(28px,6.5vw,38px);font-weight:800;line-height:1.08}
h3{font-size:22px;font-weight:600;line-height:1.2}
p{margin:0 0 12px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--btn);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* every screen arrives with a short, soft rise */
.view:not([hidden]){animation:rise .32s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* sticker = anything the child can press: hard shadow, springy press */
.sticker{border:3px solid var(--edge);box-shadow:0 6px 0 var(--sh);border-radius:22px;
  transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s}
@media (hover:hover){button.sticker:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 9px 0 var(--sh)}}
.sticker:active,button.sticker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}

.panel{border:3px solid var(--edge);box-shadow:0 6px 0 var(--sh);border-radius:22px}

/* ---- top bar ---- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--card);padding:5px 16px 5px 9px;min-height:48px;
  font-family:var(--ff-d);font-weight:600;font-size:17px;color:var(--ink);border-radius:99px;box-shadow:0 4px 0 var(--sh)}
.pill b{font-weight:800}
.mini{background:none;border:0;color:var(--ink3);font-size:15px;padding:8px 10px;min-height:44px;
  display:inline-flex;gap:6px;align-items:center}

/* ---- hero: the pegboard wall ---- */
.hero{padding:18px 18px 18px;background-color:var(--hero);
  background-image:radial-gradient(circle at 2px 2px,var(--dot) 1.9px,transparent 2.1px);background-size:24px 24px}
.hello{display:flex;gap:14px;align-items:center}
.hello .mas{flex:none;display:flex;flex-direction:column;align-items:center}
.nametag{font-family:var(--ff-d);font-weight:600;font-size:16px;color:var(--ink2);margin-top:2px}
.bubble{position:relative;flex:1 1 auto;min-width:0;background:var(--card);border:3px solid var(--edge);
  border-radius:22px;padding:14px 18px;box-shadow:0 5px 0 var(--sh);
  font-family:var(--ff-d);font-weight:600;font-size:clamp(20px,4.6vw,26px);line-height:1.25;
  animation:bubbleIn .4s cubic-bezier(.16,1,.3,1) backwards;transform-origin:left center}
@keyframes bubbleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.bubble::before{content:"";position:absolute;left:-13px;top:34px;width:20px;height:20px;background:var(--card);
  border-left:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:rotate(45deg)}
.warn{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--build-w);border:2.5px solid var(--build);
  font-size:16px;color:var(--ink)}

/* the helper is alive, but only a little: a slow bob, a rare blink, a glowing bulb */
.m-all,.m-eyes,.m-bulb{transform-box:fill-box;transform-origin:center}
.m-pupils{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .3s ease-out}
.mas.alive .m-all{animation:bob 3.8s ease-in-out infinite}
.mas.alive .m-eyes{animation:blink 5.6s infinite}
.mas.alive .m-bulb{animation:glow 2.8s ease-in-out infinite}
.mas.hop .m-all{animation:hop .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}22%{transform:translateY(3px) scale(1.07,.9)}55%{transform:translateY(-16px) scale(.95,1.07)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1,1)}}

/* ---- today's star tray ---- */
.tray{display:flex;align-items:center;gap:10px;margin-top:16px;padding:7px 16px 7px 18px;background:var(--card);
  border:3px solid var(--edge);border-radius:99px;width:max-content;max-width:100%;box-shadow:0 4px 0 var(--sh)}
.tray .lbl{font-family:var(--ff-d);font-weight:600;font-size:18px;margin-right:2px}
.tray .slot{display:inline-flex}
.tray svg{width:36px;height:36px}
.tray .slot.new svg{animation:pop .6s cubic-bezier(.3,1.5,.5,1)}

/* ---- treasure ---- */
.week{margin-top:22px;display:flex;gap:16px;align-items:center;padding:16px 18px;background:var(--card)}
.week .tx{flex:1;min-width:0}
.week b{font-family:var(--ff-d);font-weight:600;font-size:20px;display:block;line-height:1.2}
.week small{color:var(--ink2);font-size:16px}
.bar{height:14px;border-radius:99px;background:var(--sunk);margin-top:10px;overflow:hidden;border:2px solid var(--edge)}
.bar i{display:block;width:100%;height:100%;background:var(--star);transform-origin:left;transition:transform .5s cubic-bezier(.16,1,.3,1)}

/* ---- stations ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:20px;margin-top:26px}
.grid.in .st{animation:tileIn .5s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--i,0)*80ms)}
@keyframes tileIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.st{position:relative;display:flex;gap:14px;align-items:center;text-align:left;padding:16px 16px 16px 14px;
  min-height:128px;background:var(--w);color:var(--ink)}
.st .ic{flex:none;width:72px;height:72px}
.st .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.st .nm{font-family:var(--ff-d);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.st .tg{font-size:17px;color:var(--ink2);line-height:1.3}
.st .mn{font-size:15px;color:var(--ink3);margin-top:3px}
.st.done{background:var(--card)}
.st.done .nm{color:var(--ink3)}
.st .badge{position:absolute;top:-13px;right:14px;background:var(--star);color:#14221E;font-family:var(--ff-d);
  font-weight:800;font-size:15px;padding:4px 12px;border-radius:99px;border:3px solid var(--edge)}
.st .tick{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:700;font-size:16px}
.endday{margin-top:26px;padding:18px;background:var(--explain-w);text-align:center;
  font-family:var(--ff-d);font-weight:800;font-size:24px;line-height:1.2}
.gate{display:block;margin:38px auto 0;background:none;border:2px dashed var(--line);color:var(--ink3);
  padding:10px 20px;border-radius:99px;font-size:15px;min-height:46px;user-select:none;-webkit-user-select:none;touch-action:none}
.gate[data-hold="1"]{border-style:solid;border-color:var(--btn);color:var(--ink)}

/* ---- welcome: one question at a time ---- */
.welcome{margin-top:24px;padding:20px;background:var(--card)}
.steps3{display:flex;gap:8px;margin-bottom:14px}
.steps3 i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--edge);background:var(--card);display:block}
.steps3 i.on{background:var(--btn)}
.welcome label{display:block;font-family:var(--ff-d);font-weight:800;font-size:clamp(26px,6vw,32px);line-height:1.1}
.welcome input[type=text]{width:100%;margin-top:14px;font-family:inherit;font-size:22px;padding:14px 16px;min-height:60px;
  border-radius:16px;border:3px solid var(--line);background:var(--sunk);color:var(--ink)}
.welcome input:focus{outline:none;border-color:var(--btn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:8px 16px;min-height:44px;border-radius:99px;background:var(--card);border:2.5px solid var(--edge);
  font-size:17px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.chip.static{background:var(--read-w);border-color:var(--read);min-height:0;padding:5px 14px}
.chip.rm{display:inline-flex;align-items:center;gap:8px;background:var(--read-w);border-color:var(--read);min-height:44px;padding:4px 8px 4px 14px;font-size:16px}
.chip.rm b{font-weight:700;font-size:20px;line-height:1;padding:0 6px}

/* ---- station screen ---- */
.back{background:none;border:0;color:var(--ink2);padding:10px 4px;min-height:46px;font-size:18px}
.sthead{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.sthead .ic{width:64px;height:64px;flex:none}
.sthead h2{color:var(--c)}
.pick{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;min-height:78px;background:var(--card);color:var(--ink)}
.pick .opt{animation:tileIn .45s cubic-bezier(.16,1,.3,1) backwards}
.pick .opt:nth-child(2){animation-delay:70ms}.pick .opt:nth-child(3){animation-delay:140ms}
.opt b{font-family:var(--ff-d);font-size:23px;font-weight:600;display:block;line-height:1.2}
.opt .d{color:var(--ink2);font-size:17px;display:block;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;background:var(--sunk);font-size:14.5px;color:var(--ink2);max-width:100%}
.tag.ok{background:var(--explain-w);color:var(--ink)}
.how{margin-top:20px;padding:20px;background:var(--w)}
.how ol{margin:10px 0 0;padding:0;list-style:none}
.step{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 0;
  min-height:58px;font-size:21px;line-height:1.5;color:var(--ink)}
.step .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-weight:800;font-size:19px;
  transition:transform .18s cubic-bezier(.3,1.7,.5,1),background .15s;margin-top:1px}
.step:active .num{transform:scale(.86)}
.step.on .num{background:var(--btn);color:var(--btn-ink);transform:scale(1.08)}
.step.on .stx{color:var(--ink2)}
.need{margin-top:8px;color:var(--ink2);font-size:17px}
.twist{margin:12px 0 0;color:var(--ink2);font-size:17px}
.twist b{color:var(--ink)}
.stretch{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--card);border:2.5px dashed var(--edge);font-size:18px}
.btn{font-family:var(--ff-d);font-weight:800;font-size:24px;padding:16px 30px;min-height:64px;border-radius:99px;
  background:var(--btn);color:var(--btn-ink);border:3px solid var(--edge);box-shadow:0 6px 0 var(--sh);
  transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.btn.sm{font-family:var(--ff-b);font-weight:700;font-size:17px;padding:10px 18px;min-height:50px;box-shadow:0 4px 0 var(--sh)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.ready{animation:ready 1.7s ease-in-out infinite}
@keyframes ready{0%,100%{box-shadow:0 6px 0 var(--sh),0 0 0 0 rgba(47,184,166,.0)}50%{box-shadow:0 6px 0 var(--sh),0 0 0 9px rgba(47,184,166,.28)}}
.row{display:flex;flex-wrap:wrap;gap:16px 14px;align-items:center;margin-top:24px}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;padding:12px 6px;min-height:46px;font-size:17px}
.ico{display:inline-flex;align-items:center;gap:8px}
.timer{display:flex;gap:14px;align-items:center;margin-top:16px}
.timer svg{width:74px;height:74px}
.timer .t{font-family:var(--ff-d);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.earned{margin-top:18px;padding:22px;background:var(--card);text-align:center}
.earned .big{display:flex;justify-content:center;margin-bottom:6px}
.earned .big svg{width:76px;height:76px;animation:pop .55s ease-out}
.earned .sub{color:var(--ink2);margin:6px 0 0;font-size:17px}
.reveal{display:flex;justify-content:center;align-items:center;position:relative;margin:2px 0 6px;height:150px}
.reveal::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,226,122,.75),rgba(255,226,122,0) 66%);animation:glowin 1s ease-out}
.reveal svg{position:relative;width:132px;height:132px;filter:drop-shadow(0 5px 0 var(--sh));
  animation:peel .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes peel{0%{transform:scale(.2) rotate(-45deg);opacity:0}60%{transform:scale(1.14) rotate(7deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes glowin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.wig{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:18px;color:var(--ink2)}
.wig b{color:var(--ink)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.jar{margin-top:34px;padding:18px;background:var(--card)}
.jar form{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.jar input[type=text]{flex:1 1 180px;min-width:0;font-family:inherit;font-size:20px;padding:12px 14px;min-height:54px;
  border-radius:14px;border:3px solid var(--line);background:var(--sunk);color:var(--ink)}
.jar input:focus{outline:none;border-color:var(--read)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-18px;width:10px;height:15px;border-radius:2px;animation:fall 1.9s ease-in forwards}
.confetti i.s{width:17px;height:17px;border-radius:0;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(560deg)}}

/* ---- sticker album ---- */
.albhead{margin:4px 0 0}
.albsub{color:var(--ink2);margin:6px 0 0;font-size:18px}
.meter{height:14px;border-radius:99px;background:var(--sunk);margin:12px 0 0;overflow:hidden;border:2px solid var(--edge)}
.meter i{display:block;width:100%;height:100%;background:var(--star);transform-origin:left}
.albsec{margin-top:26px;padding:16px 16px 18px;background:var(--w)}
.albsec h3{color:var(--c);font-size:26px;font-weight:800}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;margin-top:12px}
.stk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.stk svg{width:92px;height:92px;filter:drop-shadow(0 3px 0 var(--sh))}
.stk.locked svg{filter:none}
.stk .nm{font-family:var(--ff-d);font-weight:600;font-size:16px;line-height:1.2}
.stk .lv{font-size:14px;color:var(--ink2)}
.stk.locked .nm{color:var(--ink3)}

/* ---- grown-ups ---- */
.g h3{margin:32px 0 8px}
.g p,.g li{color:var(--ink2);font-size:16.5px;max-width:64ch}
.g ul{padding-left:20px;margin:8px 0 0}
.g li{margin-bottom:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tabs button{min-height:46px;padding:8px 18px;border-radius:99px;border:2.5px solid var(--edge);background:var(--card);
  font-weight:700;font-size:16px;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.note{padding:14px 16px;border-radius:14px;background:var(--sunk);font-size:16px;color:var(--ink2);margin-top:14px}
.note b{color:var(--ink)}
.note.ok{background:var(--explain-w);border:2.5px solid var(--explain);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px;font-size:15.5px;color:var(--ink2)}
.field input,.field textarea{font-family:inherit;font-size:17px;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:46px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 16px}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{border-collapse:collapse;width:100%;min-width:340px;font-size:15.5px}
.tbl td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.tbl td b{color:var(--ink)}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}

/* the scene builder: background + a list of [piece, x, y, scale, options] */
function scn(bg,items,alt){
  var out='<svg viewBox="0 0 400 240" class="scn" role="img" aria-label="'+esc(alt||'illustration')+'">'+(BGS[bg||'sky']||BGS.sky)();
  (items||[]).forEach(function(it){
    var f=SC[it[0]];if(!f)return;
    var o=it[4]||{},s=it[3]||1;
    out+='<g transform="translate('+it[1]+' '+it[2]+') rotate('+(o.r||0)+') scale('+(o.flip?-s:s)+' '+s+')">'+f(o)+'</g>';
  });
  return out+'</svg>';
}

/* ---------- the curriculum engine: rounds of questions that adapt to the child ---------- */
/* A module generates a round (a list of questions) for a level from 1 to 5. The engine plays it:
   one question at a time, a free hint, one gentle retry, then the answer and why. Nothing is ever
   timed and nothing is marked wrong in red. After the round the level moves up, stays, or eases
   back, so the work keeps sitting just beyond what he can already do. */
function R(n){return Math.floor(Math.random()*n);}
function ri(a,b){return a+R(b-a+1);}
function pick1(a){return a[R(a.length)];}
function shuf(a){a=a.slice();var i,j,t;for(i=a.length-1;i>0;i--){j=R(i+1);t=a[i];a[i]=a[j];a[j]=t;}return a;}
function plainText(h){return String(h).replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/&#8722;|&minus;/g,"minus").replace(/&times;/g,"times").replace(/&divide;|&#247;/g,"divided by").replace(/&amp;/g,"and").replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/\u2212/g," minus ").replace(/\u00D7/g," times ").replace(/\u00F7/g," divided by ").replace(/\u25A2/g," blank ").replace(/\s+/g," ").trim();}
var LVL_TXT={1:"Warm-up",2:"Grade 2",3:"Stretch",4:"Grade 3",5:"Grade 4"};
var LVL_GRADE={1:"grade 1 to 2",2:"grade 2",3:"grade 2 to 3",4:"grade 3",5:"grade 4"};
function lvlDots(l){var s='',i;for(i=1;i<=5;i++)s+='<i class="'+(i<=l?'on':'')+'"></i>';return '<span class="lvd" role="img" aria-label="Level '+l+' of 5">'+s+'</span>';}

var NAMES=["Mia","Leo","Ava","Sam","Noah","Zoe","Max","Ivy","Ben","Luz","Kai","Eli"];
var MODS={};
function defMod(m){MODS[m.id]=m;return m;}

/* ---------- what he can do, per skill ---------- */
function skillsAll(){return store.get("skills",{});}
function skillOf(id){
  var s=skillsAll()[id];s=(s&&typeof s==="object")?s:{};
  var lvl=Math.max(1,Math.min(5,Math.round(Number(s.lvl))||2));
  return {lvl:lvl,best:Math.max(lvl,Math.min(5,Math.round(Number(s.best))||lvl)),rounds:Math.max(0,Number(s.rounds)||0),
          ok:Math.max(0,Number(s.ok)||0),n:Math.max(0,Number(s.n)||0),last:String(s.last||""),
          hist:Array.isArray(s.hist)?s.hist.filter(function(x){return typeof x==="number"&&isFinite(x);}).slice(-10):[]};
}
function saveSkill(id,s){var all=skillsAll();all[id]=s;store.set("skills",all);}

/* ---------- playing a round ---------- */
var RS=null,RT=[],kpOff=null;
function rtimer(fn,ms){var id=setTimeout(fn,ms);RT.push(id);return id;}
function clearRT(){RT.forEach(function(id){clearTimeout(id);});RT=[];if(kpOff){kpOff();kpOff=null;}}
var CHEERS=["Yes!","Nice thinking!","You got it!","Brilliant!","Exactly right!","Great job!","That is it!"];
var TRYAGAIN=["Not quite. Have another look.","Close! Try once more.","Hmm, give it another go.","Almost. Try again!"];

function startRound(id){
  clearRT();
  var m=MODS[id];if(!m)return;
  var sk=skillOf(id),qs=m.gen(sk.lvl,m.n||6);
  RS={mod:m,lvl:sk.lvl,qs:qs,i:0,res:[],att:0,solved:false,sum:null,scored:qs.filter(function(q){return q.kind!=="read";}).length};
}
function roundDots(){
  var qi=0,total=RS.scored,cq=0,i;
  for(i=0;i<=RS.i&&i<RS.qs.length;i++)if(RS.qs[i].kind!=="read")cq=qi=cq+1;
  var q=RS.qs[RS.i],lab=q&&q.kind==="read"?'Page '+q.page+' of '+q.pages:'Question '+Math.max(1,qi)+' of '+total;
  return '<div class="rdots" role="img" aria-label="'+lab+'">'+
    RS.qs.map(function(x,i){var r=RS.res[i],c=x.kind==="read"?'pg'+(i<RS.i||r===-1?' d':'')+(i===RS.i?' cur':''):(r===3?'g':r===0?'s':r>0?'a':'')+(i===RS.i?' cur':'');return '<i class="'+c+'"></i>';}).join('')+'</div>';
}
function renderQuestion(){
  clearRT();
  var q=RS.qs[RS.i],box=document.getElementById("rbody");if(!box||!q)return;
  RS.att=0;RS.solved=false;
  document.getElementById("rdotsBox").innerHTML=roundDots();
  if(q.kind==="read"){
    var nxt=RS.qs[RS.i+1],last=!nxt||nxt.kind!=="read",prev=RS.i>0&&RS.qs[RS.i-1].kind==="read";
    box.innerHTML='<div class="rq-t">'+esc(q.title)+'</div><div class="rq-fig page">'+q.fig+'</div><p class="rq-read" id="rqP">'+q.prompt+'</p>'+
      '<div class="rq-tools">'+(canSpeak?'<button class="btn sm alt" id="rqSay" type="button"><span class="ico">'+speakerSvg()+' Read it to me</span></button>':'')+
      (prev?'<button class="btn sm alt" id="rqPrev" type="button">&larr; Back</button>':'')+'</div>'+
      '<div class="rq-next"><button class="btn" id="rqGo" type="button">'+(last?(nxt?'Now some questions':'All done'):'Next page &rarr;')+'</button></div>';
    var sy0=document.getElementById("rqSay");if(sy0)sy0.addEventListener("click",function(){say(q.say||plainText(q.prompt));});
    var pv=document.getElementById("rqPrev");if(pv)pv.addEventListener("click",function(){RS.i--;SFX.pop();renderQuestion();window.scrollTo(0,0);});
    document.getElementById("rqGo").addEventListener("click",function(){RS.res[RS.i]=-1;SFX.pop();nextQ();window.scrollTo(0,0);});
    RS.q=q;RS.solved=true;
    return;
  }
  box.innerHTML=(q.title?'<div class="rq-t">'+esc(q.title)+'</div>':'')+
    '<div class="rq-p'+(plainText(q.prompt).length<22?' big':'')+'" id="rqP">'+q.prompt+'</div>'+(q.fig?'<div class="rq-fig">'+q.fig+'</div>':'')+

/* ---------- a handy generator wrapper: n different questions ---------- */
function makeN(n,fn){
  var out=[],seen={},tries=0;
  while(out.length<n&&tries<400){tries++;var q=fn(out.length);if(!q)continue;var k=q.key||q.prompt;if(seen[k])continue;seen[k]=1;out.push(q);}
  while(out.length<n){out.push(fn(out.length));}
  return out;
}
function mcQ(prompt,right,wrongs,more){
  var q={kind:"mc",prompt:prompt,opts:[{t:right,ok:true}].concat(wrongs.map(function(w){return {t:w};}))};
  if(more)for(var k in more)q[k]=more[k];return q;
}
function numQ(prompt,ans,more){var q={kind:"num",prompt:prompt,ans:ans};if(more)for(var k in more)q[k]=more[k];return q;}

/* ---- 2. Maze Runner ---- */
function genMaze(w,h){
  var cells=[],x,y,stack=[[0,0]],seen={'0,0':1},DIRS=[[0,-1,'N','S'],[1,0,'E','W'],[0,1,'S','N'],[-1,0,'W','E']];
  for(y=0;y<h;y++){cells.push([]);for(x=0;x<w;x++)cells[y].push({N:1,E:1,S:1,W:1});}
  while(stack.length){
    var c=stack[stack.length-1],opts=shuf(DIRS).filter(function(d){var nx=c[0]+d[0],ny=c[1]+d[1];return nx>=0&&ny>=0&&nx<w&&ny<h&&!seen[nx+','+ny];});
    if(!opts.length){stack.pop();continue;}
    var d=opts[0],nx=c[0]+d[0],ny=c[1]+d[1];cells[c[1]][c[0]][d[2]]=0;cells[ny][nx][d[3]]=0;seen[nx+','+ny]=1;stack.push([nx,ny]);
  }
  return {w:w,h:h,cells:cells};
}
function mazeSolve(mz){
  var q=[[0,0,[[0,0]]]],seen={'0,0':1},DIRS=[[0,-1,'N'],[1,0,'E'],[0,1,'S'],[-1,0,'W']],cur,i;
  while(q.length){cur=q.shift();if(cur[0]===mz.w-1&&cur[1]===mz.h-1)return cur[2];
    for(i=0;i<4;i++){var d=DIRS[i],nx=cur[0]+d[0],ny=cur[1]+d[1];if(nx<0||ny<0||nx>=mz.w||ny>=mz.h||mz.cells[cur[1]][cur[0]][d[2]]||seen[nx+','+ny])continue;seen[nx+','+ny]=1;q.push([nx,ny,cur[2].concat([[nx,ny]])]);}}
  return null;
}
function mazeSvg(mz,pos,trail,path){
  var S=Math.floor(300/Math.max(mz.w,mz.h)),o='',x,y,c,X=function(v){return 6+v*S;};
  if(path)o+='<polyline points="'+path.map(function(p){return (X(p[0])+S/2)+','+(X(p[1])+S/2);}).join(' ')+'" fill="none" stroke="#6FCB9C" stroke-width="'+Math.max(4,S/4)+'" stroke-linecap="round" stroke-linejoin="round"/>';
  (trail||[]).forEach(function(p){o+='<circle cx="'+(X(p[0])+S/2)+'" cy="'+(X(p[1])+S/2)+'" r="'+S/6+'" fill="#CFE9DC"/>';});
  for(y=0;y<mz.h;y++)for(x=0;x<mz.w;x++){c=mz.cells[y][x];
    if(c.N)o+='<line x1="'+X(x)+'" y1="'+X(y)+'" x2="'+X(x+1)+'" y2="'+X(y)+'" '+K(4)+'/>';
    if(c.W)o+='<line x1="'+X(x)+'" y1="'+X(y)+'" x2="'+X(x)+'" y2="'+X(y+1)+'" '+K(4)+'/>';
    if(y===mz.h-1&&c.S)o+='<line x1="'+X(x)+'" y1="'+X(y+1)+'" x2="'+X(x+1)+'" y2="'+X(y+1)+'" '+K(4)+'/>';
    if(x===mz.w-1&&c.E)o+='<line x1="'+X(x+1)+'" y1="'+X(y)+'" x2="'+X(x+1)+'" y2="'+X(y+1)+'" '+K(4)+'/>';}
  o+='<g transform="translate('+(X(mz.w-1)+S/2)+' '+(X(mz.h-1)+S/2)+') scale('+(S/34)+')">'+SC.star({})+'</g>';
  o+='<g transform="translate('+(X(pos[0])+S/2)+' '+(X(pos[1])+S/2)+') scale('+(S/125)+')">'+SC.bolty({})+'</g>';
  return '<svg viewBox="0 0 '+(mz.w*S+12)+' '+(mz.h*S+12)+'" class="fig fig-maze" role="img" aria-label="a maze">'+o+'</svg>';
}
function mazeWidget(mz){
  return function(box,api){
    var pos=[0,0],trail=[[0,0]],moves=0,done=false;
    box.innerHTML='<div class="mz"><div id="mzB"></div><div class="mz-pad"><button type="button" class="pbc" data-m="N" aria-label="Up">&uarr;</button><div><button type="button" class="pbc" data-m="W" aria-label="Left">&larr;</button><button type="button" class="pbc" data-m="S" aria-label="Down">&darr;</button><button type="button" class="pbc" data-m="E" aria-label="Right">&rarr;</button></div></div><div class="pb-msg" id="mzM">Moves: 0</div></div>';
    function paint(){document.getElementById("mzB").innerHTML=mazeSvg(mz,pos,trail);document.getElementById("mzM").textContent="Moves: "+moves;}
    var D={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]};
    function go(m){
      if(RS.solved||done)return;var c=mz.cells[pos[1]][pos[0]];if(c[m])return;
      pos=[pos[0]+D[m][0],pos[1]+D[m][1]];trail.push(pos.slice());moves++;SFX.pop();paint();
      if(pos[0]===mz.w-1&&pos[1]===mz.h-1){done=true;api.check(true);}
    }
    [].forEach.call(box.querySelectorAll("[data-m]"),function(b){b.addEventListener("click",function(){go(b.getAttribute("data-m"));});});
    var kh=function(ev){var k={ArrowUp:'N',ArrowDown:'S',ArrowLeft:'W',ArrowRight:'E'}[ev.key];if(k){ev.preventDefault();go(k);}};
    document.addEventListener("keydown",kh);var old=kpOff;kpOff=function(){document.removeEventListener("keydown",kh);if(old)old();};
    RS.qs[RS.i].reveal=function(){document.getElementById("mzB").innerHTML=mazeSvg(mz,[mz.w-1,mz.h-1],[],mazeSolve(mz));[].forEach.call(box.querySelectorAll("button"),function(b){b.disabled=true;});};
    paint();
  };
}

/* ---- 3. Mirror Magic: symmetry ---- */
function mirrorWidget(g,axis){
  return function(box,api){
    var w=g.w,h=g.h,C=34,mine={},x,y;
    function given(x,y){return axis==='v'?x<w/2:y<h/2;}
    function mirror(x,y){return axis==='v'?[w-1-x,y]:[x,h-1-y];}
    function target(x,y){var m=mirror(x,y);return !!g.cells[m[1]][m[0]];}
    function svg(show){var o='';
      for(y=0;y<h;y++)for(x=0;x<w;x++){var on=given(x,y)?!!g.cells[y][x]:(show?target(x,y):!!mine[x+','+y]);
        o+='<rect data-x="'+x+'" data-y="'+y+'" x="'+(6+x*C)+'" y="'+(6+y*C)+'" width="'+C+'" height="'+C+'" fill="'+(on?(given(x,y)?'#2FB8A6':'#F7B955'):(given(x,y)?'#F3F6F2':'#FFFBEF'))+'" '+K(1.6,'#9DB2A6')+'/>';}
      o+=axis==='v'?'<line x1="'+(6+w/2*C)+'" y1="0" x2="'+(6+w/2*C)+'" y2="'+(h*C+12)+'" stroke="#F2634B" stroke-width="3.4" stroke-dasharray="7 6"/>':'<line x1="0" y1="'+(6+h/2*C)+'" x2="'+(w*C+12)+'" y2="'+(6+h/2*C)+'" stroke="#F2634B" stroke-width="3.4" stroke-dasharray="7 6"/>';
      return '<svg viewBox="0 0 '+(w*C+12)+' '+(h*C+12)+'" class="fig fig-mirror" role="img" aria-label="a grid with a mirror line">'+o+'</svg>';}
    box.innerHTML='<div class="mm"><div id="mmB"></div><button class="btn" id="mmGo" type="button">Check my mirror</button></div>';
    function paint(show){document.getElementById("mmB").innerHTML=svg(show);
      if(!show)[].forEach.call(document.querySelectorAll("#mmB rect"),function(r){var X=+r.getAttribute("data-x"),Y=+r.getAttribute("data-y");if(given(X,Y))return;r.style.cursor="pointer";
        r.addEventListener("click",function(){if(RS.solved)return;var k=X+','+Y;mine[k]=!mine[k];SFX.pop();paint(false);});});}
    document.getElementById("mmGo").addEventListener("click",function(){if(RS.solved)return;var ok=true;
      for(y=0;y<h;y++)for(x=0;x<w;x++)if(!given(x,y)&&(!!mine[x+','+y])!==target(x,y))ok=false;api.check(ok);});
    RS.qs[RS.i].reveal=function(){paint(true);document.getElementById("mmGo").disabled=true;};
    paint(false);
  };
}

/* ---- 4. Logic Clues: who has what? ---- */
var PETS=[['dog','dog'],['cat','cat'],['fish','fish'],['bird','bird']],THINGS2=[['kite','kite'],['balloon','balloon'],['umbrella','umbrella'],['apple','apple']];
var SHIRTS=[P_B,P_R,P_G,P_O];
function permsOf(n){if(n===1)return [[0]];var out=[],sub=permsOf(n-1);sub.forEach(function(p){for(var i=0;i<=p.length;i++){var q=p.slice();q.splice(i,0,n-1);out.push(q);}});return out;}
function satisfies(perm,clues){return clues.every(function(c){return c.t==='has'?perm[c.p]===c.it:perm[c.p]!==c.it;});}
function genLogic(n,lvl){
  var perms=permsOf(n),sol=perms[R(perms.length)],all=[],p,it;
  for(p=0;p<n;p++)for(it=0;it<n;it++)all.push({t:sol[p]===it?'has':'not',p:p,it:it});
  var pool=shuf(all).filter(function(c){return lvl<=1?true:true;});
  if(lvl===4)pool=pool.sort(function(a,b){return (a.t==='not'?0:1)-(b.t==='not'?0:1);});
  var clues=[],i;
  for(i=0;i<pool.length;i++){clues.push(pool[i]);if(perms.filter(function(q){return satisfies(q,clues);}).length===1)break;}
  for(i=clues.length-1;i>=0;i--){var rest=clues.slice(0,i).concat(clues.slice(i+1));if(perms.filter(function(q){return satisfies(q,rest);}).length===1)clues=rest;}
  return {sol:sol,clues:clues,perms:perms.length};
}

      '</div><button class="btn" id="lgGo" type="button">Check my answer</button></div>';
    function paint(){[].forEach.call(box.querySelectorAll(".lgb"),function(b){var p=+b.getAttribute("data-p"),j=+b.getAttribute("data-i");b.classList.toggle("on",pick[p]===j);});}
    [].forEach.call(box.querySelectorAll(".lgb"),function(b){b.addEventListener("click",function(){if(RS.solved)return;var p=+b.getAttribute("data-p"),j=+b.getAttribute("data-i");pick[p]=pick[p]===j?-1:j;SFX.pop();paint();});});

    RS.qs[RS.i].reveal=function(){pick=lg.sol.slice();paint();document.getElementById("lgGo").disabled=true;};
  };

  var pool=WORDS.filter(function(w){return w[4]>=lo&&w[4]<=hi;});

 {id:"s-kite",t:"The Runaway Kite",lvl:1,pages:[

 {id:"s-mooncat",t:"The Cat and the Moon",lvl:1,pages:[
  {bg:"night",i:[["cat",120,180,1.4],["moon",300,56,1.6,{p:"full"}],["star",70,60,1,{}],["star",200,40,.8,{}]],x:"One night, a little cat looked up and saw a big, round moon. \"I want to catch it,\" she thought."},
  {bg:"night",i:[["puddle",200,190,2.6],["moon",200,196,.9,{p:"full"}],["cat",100,160,1.3]],x:"She looked down. There in the puddle was the moon too! It looked so close."},
  {bg:"night",i:[["puddle",200,192,2.6],["cat",110,160,1.3],["drop",180,160,1.2],["drop",230,150,1.1]],x:"The cat patted the water with her paw. Splash! The moon wobbled and broke into many pieces."},
  {bg:"night",i:[["puddle",200,196,2.6],["moon",200,200,.9,{p:"full"}],["moon",310,52,1.5,{p:"full"}],["cat",100,160,1.3]],x:"Soon the water was still. The moon was back again, and the cat looked up. \"Oh! The real moon is up there,\" she purred."}],
  qs:[["What did the cat want to do at first?",["Catch the moon","Eat dinner","Go to sleep","Find a mouse"],0,"She thought, \"I want to catch it.\""],
      ["Why did the moon break into pieces in the puddle?",["The cat splashed the water","The moon fell into the water","A cloud covered the puddle","The wind blew the moon away"],0,"She patted the water, and the ripples broke the picture of the moon."],
      ["Where is the real moon?",["Up in the sky","In the puddle","Under the cat's paw","In the tree"],0,"The cat understood that the real moon was up in the sky."]]},
 {id:"s-tilly",t:"Tilly Climbs the Hill",lvl:2,pages:[
  {bg:"night",i:[["turtle",120,180,1.3],["mountain",290,150,2],["star",80,50,1],["star",240,40,.8,{}]],x:"Tilly the turtle wanted to see the sunrise from the top of Big Hill. It was far, and Tilly was slow, so she began climbing in the dark."},
  {bg:"night",i:[["rabbit",290,170,1.4],["turtle",100,180,1.3],["moon",330,50,1,{p:"crescent"}]],x:"Rabbit hopped by. \"You will never make it in time!\" he laughed. \"Watch me. I will beat you to the top.\""},
  {bg:"night",i:[["mountain",200,170,2.2],["rabbit",220,90,1.1],["zzz",270,60,1.1],["turtle",100,200,1]],x:"Rabbit raced up the hill. Halfway there, he felt tired and decided to nap. \"I have plenty of time,\" he yawned."},
  {bg:"dusk",i:[["mountain",200,180,2.2],["sun",300,110,1.6],["turtle",186,80,1.1],["rabbit",138,140,.8],["sparkle",320,50,1.2]],x:"Tilly never stopped. Step by step, she reached the top just as the sun came up. When Rabbit woke, the sky was already gold."}],
  qs:[["Why did Tilly start climbing in the dark?",["She is slow, so she wanted a head start","She was afraid of the hot sunshine","Rabbit dared her to climb in the dark","She wanted to see the stars from the top"],0,"Tilly is slow, so she began early to reach the top at sunrise."],
      ["Why did Rabbit stop to nap?",["He thought he had plenty of time","He hurt his foot on a sharp rock","He wanted to wait for Tilly to catch up","He was afraid of the dark path"],0,"Rabbit said, \"I have plenty of time.\""],
      ["What is the best lesson from this story?",["Steady work can win over quick starts","Fast animals always win a long race","It is best to climb a hill at night","Sleeping is a good way to get ready"],0,"Tilly kept going without stopping, and she got there first."],
      ["In the story, the word <b>plenty</b> means...",["a lot, more than enough","only a tiny little bit","almost none, not enough","hardly any left over"],0,"Rabbit thought he had more than enough time."]]},
 {id:"s-bee",t:"Beeno and the Sleepy Flowers",lvl:2,pages:[
  {bg:"night",i:[["hive",110,120,1.4],["bee",270,100,1.8],["moon",340,40,1,{p:"half"}],["star",60,40,.8,{}]],x:"Beeno the bee was too excited to sleep. \"Tomorrow I will find the most flowers in the whole meadow,\" he buzzed."},
  {bg:"night",i:[["bee",100,100,1.5],["flower",230,160,1.6,{c:"#9AA6C8"}],["flower",320,160,1.6,{c:"#9AA6C8"}],["moon",340,40,.9,{p:"half"}]],x:"He flew out into the meadow before sunrise. But all the flowers were closed up tight, like little sleeping faces."},
  {bg:"meadow",i:[["bee",120,100,1.5],["flower",230,160,1.6,{c:P_PK}],["sun",330,50,1.2],["flower",320,166,1.5,{c:P_O}]],x:"Beeno waited and waited. Then the sun rose, and the flowers slowly opened their petals, one by one."},
  {bg:"meadow",i:[["bee",190,90,2],["flower",100,160,1.8,{c:P_PK}],["flower",300,160,1.8,{c:P_O}],["sparkle",230,130,1],["honey",340,70,.8]],x:"\"Now I know,\" said Beeno. \"Flowers open when the light comes. I just have to be patient.\" And he got to work."}],
  qs:[["Why were the flowers closed when Beeno arrived?",["It was still before sunrise","They were hiding from the bee","It was the middle of winter","They had run out of nectar"],0,"The flowers open when the light comes, and it was before sunrise."],
      ["What made the flowers open?",["The sun came up","The wind blew","Beeno woke them","It started to rain"],0,"After the sun rose, the flowers opened their petals."],
      ["What did Beeno learn?",["To be patient and wait for flowers","To fly much faster than the other bees","To sleep for longer on cold nights","To stay far away from the big meadow"],0,"He said, \"I just have to be patient.\""]]},
 {id:"s-castle",t:"Sam's Sandcastle",lvl:2,pages:[
  {bg:"beach",i:[["castle",190,196,1.6],["kid",90,176,1.4,{c:P_R}],["sun",340,40,1.2]],x:"Sam spent the whole morning building a sandcastle at the beach. It had two towers and a flag."},
  {bg:"beach",i:[["castle",190,196,1.6],["kid",70,176,1.3,{c:P_R}],["wave",300,150,1.6],["wave",340,120,1.3]],x:"Then a big wave rolled in. Whoosh! It washed the whole castle away."},
  {bg:"beach",i:[["kid",110,180,1.5,{c:P_R}],["arrow",250,170,1,{len:50,a:0,c:P_R}],["wave",340,150,1.4]],x:"Sam felt very sad. Then he saw that the waves only reached the wet sand. \"I will build farther back,\" he said."},
  {bg:"beach",i:[["castle",190,196,1.7],["wave",340,130,1.2],["kid",90,176,1.4,{c:P_R,up:true}],["sparkle",290,110,1.2]],x:"This time, the waves never touched it. Sam's new castle stood tall all afternoon."}],
  qs:[["What happened to Sam's first castle?",["A wave washed it away","It fell over in the wind","Someone stepped on it","He knocked it down"],0,"A big wave rolled in and washed the castle away."],
      ["What did Sam notice that gave him an idea?",["The waves only reached the wet sand","The sand was too dry to stay up","The castle was a little too small","It was starting to get dark outside"],0,"He saw that waves only reached the wet sand, so he built farther back."],
      ["How did Sam feel when the castle was gone, and what did he do?",["Sad, but he solved the problem","Angry, so he went home to eat","Happy, so he laughed at the wave","Scared, so he ran far away"],0,"He felt sad, then he thought of a plan and built it again."]]},
 {id:"s-pond",t:"The Cat on the Frozen Pond",lvl:3,pages:[
  {bg:"meadow",i:[["puddle",200,200,4,{c:"#E1F4FC"}],["cat",74,176,1.3],["house",350,150,1.1],["cloud",200,40,1,{}]],x:"On the coldest morning of the year, the pond froze over. A hungry cat wanted to reach the other side, where a fish shop stood."},
  {bg:"meadow",i:[["puddle",200,200,4,{c:"#E1F4FC"}],["cat",118,184,1.4],["house",350,150,1.1]],x:"The cat put one paw on the ice. It did not move. She put down another paw, very slowly, and pressed gently."},
  {bg:"meadow",i:[["puddle",200,200,4,{c:"#E1F4FC"}],["cat",200,184,1.4],["label",290,70,1,{t:"creak...",sz:26,c:OUT}],["house",350,150,1.1]],x:"Halfway across, she heard a small creak. She stopped and listened. Then she went back one step and moved to a thicker spot."},
  {bg:"meadow",i:[["puddle",200,200,4,{c:"#E1F4FC"}],["cat",292,176,1.4],["house",350,150,1.1],["sparkle",350,90,1.2]],x:"Slowly, step by step, the cat reached the far side. She had not hurried, and she had not fallen in."}],
  qs:[["Why did the cat press her paw down gently?",["She wanted to test if the ice was safe","She wanted to break the ice quickly","She was trying to walk across faster","She was playing a game with her paw"],0,"She tested the ice carefully before trusting it."],
      ["What did the cat do when she heard a creak?",["She stopped and found a thicker spot","She ran across as fast as she could","She jumped up and down on the ice","She turned around and went home"],0,"She stopped, listened, and moved to a thicker spot."],
      ["Which word best describes the cat?",["Cautious","Careless","Noisy","Lazy"],0,"She moved carefully to avoid danger, which means she was cautious."],
      ["What does <b>creak</b> mean in the story?",["A small, squeaky sound","A big, loud splash","A deep, scary roar","A bright, flashing light"],0,"A creak is a little squeaky sound, like the sound old ice or wood makes."]]},
 {id:"s-berries",t:"Nia and the Missing Strawberries",lvl:3,pages:[
  {bg:"meadow",i:[["berry",110,170,1.6],["berry",200,180,1.6],["berry",290,166,1.6],["kid",330,150,1.3,{c:P_PU}]],x:"Nia grew strawberries in her garden. Every morning there were fewer berries than the day before, and she could not tell why."},
  {bg:"night",i:[["kid",110,160,1.5,{c:P_PU}],["bush",210,176,1.6],["moon",330,50,1.1,{p:"half"}],["berry",300,190,1.2]],x:"One night, Nia sat quietly behind a bush with a flashlight. She was determined to find the thief."},
  {bg:"dusk",i:[["bird",200,100,2],["berry",110,180,1.3],["berry",300,180,1.3],["kid",330,150,1.2,{c:P_PU}]],x:"At sunrise, a small bird landed on the vines and pecked a berry. The mystery was solved!"},
  {bg:"meadow",i:[["berry",110,180,1.4],["bird",290,90,1.6],["flower",340,170,1.5,{c:P_PK}],["kid",190,150,1.4,{c:P_PU,up:true}]],x:"Nia was not angry. She planted a second berry bush by the fence, just for the birds. \"Now there is enough for everyone,\" she said."}],
  qs:[["Who was taking the strawberries?",["A bird","A rabbit","Nia's brother","A fox"],0,"A small bird landed on the vines and pecked a berry."],
      ["Why did Nia sit behind a bush at night?",["To watch and find out who took them","To pick the berries before sunrise","To sleep outside under the moon","To scare the bird away from home"],0,"She wanted to find the thief."],
      ["What does the word <b>determined</b> mean here?",["Having decided not to give up","Feeling sleepy and a bit bored","Being very afraid of the dark","Not caring about the answer"],0,"Nia would not stop until she found out what was happening."],
      ["What does Nia's choice at the end show about her?",["She is kind and finds fair solutions","She is angry and wants the bird gone","She does not like strawberries at all","She gives up when things get hard"],0,"She planted a second bush so there would be enough for everyone, which is a kind and fair way to solve the problem."]]},
 {id:"s-light",t:"The Lighthouse Keeper's Grandson",lvl:4,pages:[
  {bg:"storm",i:[["lighthouse",200,150,1.8,{on:true}],["wave",80,215,1.3],["wave",320,215,1.3],["bolt",340,70,1.2]],x:"A fierce storm raged over the sea. At the lighthouse, old Mr. Brandt had kept the great lamp burning for forty years."},
  {bg:"storm",i:[["lighthouse",200,150,1.8,{on:false}],["bolt",340,70,1.2],["wave",80,215,1.3]],x:"Suddenly the lamp went dark. \"Ships will be out there tonight,\" Mr. Brandt said. \"Without the light, they cannot see the rocks.\""},
  {bg:"storm",i:[["lighthouse",200,150,1.8,{on:false}],["kid",330,170,1.3,{c:P_R}],["bulb",340,60,1,{on:false}]],x:"His grandson Theo hurried up the stairs. The lamp's cord had been pulled loose by the wind. The boy pushed it back in tight."},
  {bg:"night",i:[["lighthouse",200,150,1.8,{on:true}],["boat",340,190,.9],["star",60,50,1,{}],["sparkle",200,40,1.2]],x:"The great light blazed across the waves once more. A small boat turned away from the rocks and sailed safely home."}],
  qs:[["Why was it important for the lighthouse lamp to work that night?",["Ships needed it to see the rocks","The storm would stop if it were on","Mr. Brandt was afraid of the dark","The kitchen needed some more light"],0,"Without the light, ships could not see the rocks."],
      ["What was wrong with the lamp?",["The cord was pulled out by wind","The glass bulb had cracked in two","It had run out of oil to burn","Someone had stolen it overnight"],0,"Theo found that the cord was pulled loose."],
      ["What does <b>fierce</b> mean in the first sentence?",["Strong and wild","Slow and quiet","Warm and soft","Small and sleepy"],0,"A fierce storm is a wild, strong storm."],
      ["How do you think Mr. Brandt felt at the end?",["Proud and happy","Bored and sleepy","Angry and upset","Sad and worried"],0,"His grandson fixed the lamp, and the ships were safe, so he would feel proud and relieved."]]},
 {id:"s-compass",t:"The Compass and the Fog",lvl:4,pages:[
  {bg:"meadow",i:[["mountain",300,130,2],["kid",100,170,1.4,{c:P_O}],["kid",170,172,1.2,{c:P_B,s:"#C98F63",h:"#2B1B12"}],["tent",350,190,.9]],x:"Ava and her father hiked up the mountain to camp for the night. The trail was clear, and they walked in bright sunshine."},
  {bg:"storm",i:[["kid",120,170,1.4,{c:P_O}],["kid",200,172,1.2,{c:P_B,s:"#C98F63",h:"#2B1B12"}],["fog",200,130,1.4],["fog",260,190,1.2]],x:"Then thick fog rolled in. Within minutes, they could not see the trail, the trees, or even each other's boots."},
  {bg:"storm",i:[["compass",200,110,2.2,{a:-20}],["label",200,200,1,{t:"The needle points north.",sz:17,c:"#fff"}]],x:"\"Stay calm,\" said Dad. He took out his compass. \"The needle always points north. Our car is to the south, so we will walk that way.\""},
  {bg:"meadow",i:[["tent",300,170,1.4],["kid",120,170,1.4,{c:P_O,up:true}],["kid",190,172,1.2,{c:P_B,s:"#C98F63",h:"#2B1B12"}],["compass",50,60,.9,{a:0}]],x:"Slowly, they followed the needle down the slope. When the fog thinned, they saw their tent just where they had left it. Ava smiled. \"I am keeping this compass in my bag forever.\""}],
  qs:[["Why could they not follow the trail in the fog?",["They could not see it","It was closed","It was too steep","They forgot the way"],0,"The fog was so thick that they could not see the trail."],
      ["How did the compass help them?",["It showed north, so they knew where to go","It lit up the path with a bright beam","It blew the fog away with a puff of air","It called for help with a loud sound"],0,"The needle pointed north, and the car was south."],
      ["What does <b>thinned</b> mean here?",["Became less thick","Became much colder","Grew louder and louder","Fell down as rain"],0,"When the fog thinned, it became less thick and they could see."],
      ["What is the best word to describe Dad in this story?",["Calm","Frightened","Careless","Grumpy"],0,"He said, \"Stay calm,\" and made a clear plan, so he was calm."]]},
 {id:"s-seed",t:"The Last Seed",lvl:5,pages:[
  {bg:"night",i:[["tree",110,170,1.5,{c:"#8C7B5A"}],["tree",250,176,1.3,{c:"#8C7B5A"}],["moon",330,50,1,{p:"crescent"}]],x:"Long ago, a drought dried up the valley. Streams vanished, fields cracked, and the old orchard stood bare. Only one tree still held a single seed."},
  {bg:"dusk",i:[["kid",120,170,1.5,{c:P_G}],["seed",260,190,3],["sparkle",240,150,1.2]],x:"A girl named Rosa found the seed in the dust. It was small, hard, and dry. \"If we plant it, it might not grow,\" her mother warned. \"But if we keep it in a drawer, it surely won't.\""},
  {bg:"warm",i:[["sprout",200,160,2.3,{stage:1}],["drop",110,70,1.8],["drop",280,60,1.4],["kid",330,150,1.3,{c:P_G}]],x:"So Rosa planted the seed and gave it a few drops of water every day, even though nothing happened for weeks. She did not give up."},
  {bg:"meadow",i:[["tree",200,150,2.6],["bee",330,70,1],["bird",90,60,1.1],["kid",320,170,1.4,{c:P_G,up:true}]],x:"Years passed. Rosa's seed grew into a tall tree that gave shade, fruit, and a home to the birds. Its seeds spread over the valley, until the orchard was full again."}],
  qs:[["Why did Rosa's mother say the seed \"surely won't\" grow in a drawer?",["A seed cannot grow unless it is planted","Seeds only grow when the weather is cold","A drawer is too dark for plants to live","Seeds do not like being in the dust"],0,"A seed has no chance to grow if it is never planted."],
      ["Which word shows how Rosa acted?",["Persistent","Impatient","Careless","Hasty"],0,"She watered the seed every day, even when nothing happened, which shows she was persistent."],
      ["What is the main message of the story?",["Small steady actions can lead to big things","Trees grow best when nobody helps them","Seeds are always better off in drawers","A drought is over when it gets cold"],0,"One small seed and daily care grew into a tree, then a whole orchard."],
      ["In the first page, what does <b>drought</b> mean?",["A long time with very little rain","A heavy storm with lots of wind","A cold winter with deep snow","A bright night with a full moon"],0,"The streams vanished and the fields cracked, which tells us there was no rain."]]},
 {id:"s-robot",t:"Bolt Wants to Taste",lvl:5,pages:[
  {bg:"indoor",i:[["bolty",110,150,1.5],["kid",290,160,1.5,{c:P_PU}],["apple",200,190,1.2]],x:"Bolt the robot had read every book about food, but he had never tasted any. \"I know that an apple is crunchy, sweet, and red,\" he said. \"But what does it feel like?\""},
  {bg:"indoor",i:[["bolty",110,150,1.5],["apple",250,170,2],["kid",330,160,1.2,{c:P_PU}]],x:"\"I cannot give you a tongue,\" said Mina, laughing. \"But I can describe it. An apple is like a tiny bite of sunshine that goes crunch.\""},
  {bg:"indoor",i:[["bolty",130,150,1.6],["bulb",260,100,2.2,{on:true}],["label",260,200,1,{t:"!",sz:46,c:P_O}]],x:"Bolt's lights blinked slowly while he thought. \"Sunshine that goes crunch,\" he repeated. \"That is not in any of my books.\""},
  {bg:"indoor",i:[["bolty",110,150,1.5],["kid",290,160,1.4,{c:P_PU,up:true}],["heart",200,70,1.6],["apple",200,190,1]],x:"\"Maybe the best descriptions are not in books,\" Mina said. \"They come from the people who share the apple with you.\" Bolt beeped happily. He had learned something no book had ever taught him."}],
  qs:[["Why does Bolt say he cannot know what an apple feels like?",["He has read about food but never tasted it","He does not like the smell of apples","He lost the books that told him about it","He is much too small to pick one up"],0,"He read every book about food, but he has never tasted it."],
      ["What did Mina mean by \"a tiny bite of sunshine that goes crunch\"?",["She used a word picture to help him imagine","The apple was truly made out of sunshine","The apple was glowing like a small lamp","She wanted him to eat the apple right away"],0,"She used a comparison to help Bolt imagine the taste and the crunch."],
      ["Why did Bolt say \"That is not in any of my books\"?",["He had never read a line like it","He did not understand her words","He could not hear what she said","His books had all been burned"],0,"Mina's description was new to him, and it was not written in his books."],
      ["What did Bolt learn at the end?",["Some things are best learned from people","Books are never worth reading again","Robots are not able to learn new things","Apples are not real and cannot be tasted"],0,"Mina said the best descriptions come from the people who share the apple, which taught Bolt something no book could."]]},
 {id:"s-rainy",t:"Max and the Rainy Day",lvl:1,pages:[
  {bg:"sky",i:[["house",290,150,1.7],["cloud",290,28,1.3,{dark:true}],["rain",290,76,1.7],["kid",100,172,1.5,{c:P_G}]],x:"It was raining, and Max could not go out to play. He sat on the sofa with a long, sad face."},
  {bg:"indoor",i:[["kid",120,170,1.6,{c:P_G}],["cat",300,190,1.4]],x:"His cat, Pickle, rubbed against his leg. \"Do you want to play, Pickle?\" asked Max. Pickle purred."},
  {bg:"indoor",i:[["tent",200,158,2.2,{c:P_PU}],["cat",330,192,1],["kid",80,172,1.3,{c:P_G,up:true}]],x:"Max had an idea. He took the blankets off the beds and built a big fort. Pickle jumped inside first."},
  {bg:"indoor",i:[["tent",200,158,2.2,{c:P_PU}],["kid",84,172,1.3,{c:P_G,up:true}],["sparkle",300,56,1.4],["star",100,50,1]],x:"Soon the fort was a ship on the sea. Max was the captain, and Pickle was his crew. \"Rainy days are the best,\" said Max."}],
  qs:[["Why was Max sad at the start?",["He could not go outside to play","He had misplaced his favorite toy","He was feeling extremely hungry","He was too sleepy to play games"],0,"It was raining, so Max could not go out to play."],
      ["What did Max build?",["A fort","A boat","A tower","A bed"],0,"He built a big fort from blankets."],

function pickStory(lvl){
  var seen=store.get("storiesSeen",[]),un=function(s){return seen.indexOf(s.id)<0;},pool;
  pool=STORIES.filter(function(s){return s.lvl===lvl&&un(s);});
  if(!pool.length)pool=STORIES.filter(function(s){return Math.abs(s.lvl-lvl)<=1&&un(s);});
  if(!pool.length)pool=STORIES.filter(un);
  if(!pool.length)pool=STORIES.filter(function(s){return Math.abs(s.lvl-lvl)<=1;});
  return pick1(pool);
}

  });
  s.qs.forEach(function(q,i){

}

      ["Which sentence is TRUE?",["The Moon does not make its own light","The Moon is a star","The Moon is hot like the Sun","The Moon gets smaller every night forever"],0,"The Moon only shines because the Sun lights it up."]]},
 {id:"volcano",t:"What a volcano is",lvl:3,tags:["earth","dinosaurs"],pages:[
  {bg:"inside",i:[["volcano",200,112,1.3,{erupt:false}],["ground",200,156,1,{c:P_DBR}],["planet",200,206,1.5,{c:P_O}],["label",200,212,1,{t:"magma",sz:18,c:OUT}]],x:"Deep under the ground, rock gets so hot that it melts. Melted rock is called magma."},
  {bg:"inside",i:[["ground",200,120,1,{c:P_DBR}],["planet",200,214,1.8,{c:P_O}],["arrow",120,150,1,{len:50,a:-90,c:P_R}],["arrow",200,140,1,{len:50,a:-90,c:P_R}],["arrow",280,150,1,{len:50,a:-90,c:P_R}]],x:"Magma is lighter than the rock around it, so it pushes up through cracks toward the surface."},
  {bg:"sky",i:[["volcano",200,176,1.8]],x:"When magma bursts out of a volcano, it is called lava. Lava glows red-hot and flows downhill."},
  {bg:"sky",i:[["mountain",300,170,1.8],["volcano",130,176,1.5,{erupt:false}],["wave",60,232,1.2],["wave",200,232,1.4],["wave",340,232,1.2]],x:"Lava cools and hardens into new rock. After many eruptions, volcanoes can build mountains and even islands."}],
  qs:[["What is melted rock under the ground called?",["Magma","Lava","Ash","Ice"],0,"Melted rock under the ground is magma."],
      ["What is it called when it flows out of a volcano?",["Lava","Water","Snow","Mud"],0,"Magma that comes out of a volcano is called lava."],
      ["What happens to lava as it cools?",["It turns into hard rock","It turns into water","It floats away","It turns into ice"],0,"Cooling lava hardens into rock."]]},
 {id:"thunder",t:"Thunder and lightning",lvl:3,tags:["weather"],pages:[
  {bg:"storm",i:[["cloud",200,70,2.8,{dark:true}],["rain",200,152,1.7]],x:"A storm cloud is full of tiny bits of ice and water that bump and rub together."},
  {bg:"storm",i:[["cloud",200,60,2.6,{dark:true}],["bolt",200,158,2.5]],x:"That builds up electricity. When it jumps, you see a giant spark called lightning."},
  {bg:"storm",i:[["bolt",118,120,2.2],["arrow",216,120,1,{len:56,a:0,c:P_Y}],["arrow",216,80,1,{len:46,a:-30,c:P_Y}],["arrow",216,160,1,{len:46,a:30,c:P_Y}],["label",320,128,1,{t:"BOOM!",sz:36,c:P_Y,halo:OUT}]],x:"Lightning heats the air so fast that the air bursts outward. That makes the loud sound called thunder."},
  {bg:"storm",i:[["kid",70,176,1.2],["house",330,164,1.3],["bolt",240,110,1.7],["label",150,36,1,{t:"light is fast, sound is slower",sz:15,c:"#fff"}]],x:"Light travels much faster than sound. So you see the lightning first, and hear the thunder after."}],
  qs:[["What is lightning?",["A giant electric spark","A huge ball of fire from the Sun","A very fast bird","Rain turning to glass"],0,"Lightning is a giant spark of electricity."],
      ["Which do you notice first in a storm?",["The lightning","The thunder","Both at exactly the same time","Neither"],0,"Light is faster than sound, so you see lightning first."],
      ["What makes thunder?",["Air bursting outward after fast heating","Clouds crashing together up high","Rain drops hitting the hard ground","Wind whistling through tall trees"],0,"Lightning heats the air so quickly that it bursts outward and makes thunder."]]},
 {id:"spiders",t:"All about spiders",lvl:3,tags:["animals"],pages:[
  {bg:"plain",i:[["spider",110,120,2],["bee",292,120,1.9],["label",110,208,1,{t:"8 legs",sz:22}],["label",292,208,1,{t:"6 legs",sz:22}]],x:"A spider is not an insect. A spider has eight legs. An insect has six."},
  {bg:"plain",i:[["wire",200,100,1,{pts:"0,-70 0,6",c:"#C7CFD6"}],["spider",200,118,2.4]],x:"Spiders make silk inside their bodies. It comes out as a very thin, very strong thread."},
  {bg:"meadow",i:[["web",196,112,2.1],["spider",196,112,.9],["bee",316,60,.8]],x:"Many spiders spin sticky webs. When a bug bumps into the web, it gets stuck, and the spider eats it."},
  {bg:"meadow",i:[["spider",140,160,1.6],["grass",290,200,2],["grass",220,206,1.6]],x:"Some spiders do not spin webs at all. They chase or ambush their food instead."}],
  qs:[["How many legs does a spider have?",["Eight","Six","Four","Ten"],0,"A spider has eight legs."],
      ["What do many spiders use a web for?",["Catching food","Sleeping on","Keeping warm","Hiding from the rain"],0,"Sticky webs catch bugs for the spider to eat."],
      ["Which sentence is TRUE?",["A spider is not an insect","A spider is an insect","A spider has six legs","All spiders spin webs"],0,"Spiders have eight legs, and insects have six, so spiders are not insects."]]},
 {id:"boats-float",t:"Why boats float",lvl:3,tags:["ocean","machines"],pages:[
  {bg:"water",i:[["boat",112,96,1.5],["rock",300,176,1.2]],x:"A huge steel ship floats, but a small stone sinks. Why?"},
  {bg:"water",i:[["boat",200,98,1.8],["arrow",140,162,1,{len:44,a:-90,c:P_R}],["arrow",200,162,1,{len:44,a:-90,c:P_R}],["arrow",260,162,1,{len:44,a:-90,c:P_R}],["label",200,222,1,{t:"water pushes UP",sz:18,c:"#fff"}]],x:"Water pushes up on everything in it. This upward push is called buoyancy."},
  {bg:"water",i:[["boat",200,96,2.1],["arrow",120,170,1,{len:50,a:-90,c:P_R}],["arrow",200,176,1,{len:62,a:-90,c:P_R}],["arrow",280,170,1,{len:50,a:-90,c:P_R}]],x:"A ship is shaped like a giant bowl full of air. It pushes aside a lot of water, so the water pushes up very hard."},
  {bg:"deep",i:[["rock",200,150,1.7],["arrow",200,108,1,{len:26,a:-90,c:P_R}],["arrow",200,196,1,{len:20,a:90,c:"#fff"}]],x:"A small stone pushes aside very little water. The push up is too small, so the stone sinks."}],
  qs:[["Why can a huge steel ship float?",["Its shape pushes aside lots of water","Steel is lighter than the water","It is held up by tiny balloons","The wind lifts it onto the sea"],0,"A ship's wide shape pushes aside a lot of water, so the water pushes up hard."],
      ["What is the upward push of water called?",["Buoyancy","Gravity","Magnetism","Friction"],0,"The upward push of water is called buoyancy."],
      ["Why does a small stone sink?",["It pushes aside too little water","It is too light","It is magnetic","Water does not like stones"],0,"A small stone does not push aside enough water to be held up."]]},
 {id:"bridges",t:"How bridges stay up",lvl:4,tags:["machines"],pages:[
  {bg:"water",i:[["wave",200,150,1.8],["bridge",200,112,2.1]],x:"Bridges carry people and cars over rivers and valleys."},
  {bg:"plain",i:[["bridge",200,150,1.9],["arrow",200,56,1,{len:56,a:90,c:P_R}],["label",282,56,1,{t:"weight",sz:20,c:P_R}]],x:"A bridge must hold up its own weight and everything that crosses it."},
  {bg:"plain",i:[["truss",200,125,2.7]],x:"Triangles are very strong shapes. They do not squash or bend easily, so many bridges are built from triangles."},
  {bg:"plain",i:[["bridge",200,152,2.2],["arrow",72,206,1,{len:44,a:150,c:P_R}],["arrow",328,206,1,{len:44,a:30,c:P_R}]],x:"An arch bridge pushes the weight outward and down into its two strong ends."}],
  qs:[["Which shape is very strong and used in many bridges?",["The triangle","The circle","The star","The wavy line"],0,"Triangles do not bend easily, so bridges use them."],
      ["What does an arch bridge do with the weight?",["Passes it along to its two strong ends","Keeps it stored safely in the middle","Throws it up into the sky above","Hides it deep under the river"],0,"An arch passes the weight outward and down into its ends."],
      ["A bridge must hold up...",["its own weight and what crosses it","only the cars that drive on it","just the wind that blows past it","nothing, because it is a rock"],0,"A bridge holds its own weight plus everything on it."]]},
 {id:"circuit",t:"How a light bulb lights up",lvl:4,tags:["machines","robots"],pages:[
  {bg:"plain",i:[["bulb",200,100,2.2,{on:false}],["wire",200,190,1,{pts:"-120,0 120,0"}]],x:"Electricity is energy that can flow through wires, a bit like water flowing through a pipe."},
  {bg:"plain",i:[["bulb",200,70,1.5,{on:false}],["wire",200,150,1,{pts:"-30,-66 -110,-66 -110,40 -54,40"}],["wire",200,150,1,{pts:"30,-66 110,-66 110,40 54,40"}],["battery",200,190,1.5]],x:"A battery pushes the electricity along. It travels around a loop called a circuit."},
  {bg:"plain",i:[["bulb",200,70,1.5,{on:true}],["wire",200,150,1,{pts:"-30,-66 -110,-66 -110,40 -54,40"}],["wire",200,150,1,{pts:"30,-66 110,-66 110,40 54,40"}],["battery",200,190,1.5]],x:"When the loop is complete, the electricity can flow all the way around, and the bulb lights up."},
  {bg:"plain",i:[["bulb",200,70,1.5,{on:false}],["wire",200,150,1,{pts:"-30,-66 -110,-66 -110,40 -54,40"}],["wire",200,150,1,{pts:"30,-66 110,-66 110,6"}],["battery",200,190,1.5],["label",330,170,1,{t:"gap!",sz:24,c:P_R}]],x:"If the loop is broken, the electricity stops and the bulb goes out. A switch opens and closes the loop."}],
  qs:[["What is a circuit?",["A complete loop for electricity to flow","A strong kind of battery for lamps","A glowing type of very bright bulb","A tall metal tower that holds wires"],0,"A circuit is a complete loop for electricity."],
      ["What happens if a wire in the loop is cut?",["The bulb goes out","The bulb gets brighter","The battery grows","Nothing changes"],0,"A broken loop stops the electricity, so the bulb goes out."],
      ["What does a switch do?",["Opens and closes the loop","Makes the battery bigger","Makes electricity wet","Paints the wire"],0,"A switch opens or closes the circuit."]]},
 {id:"heart",t:"What your heart does",lvl:4,tags:["body"],pages:[
  {bg:"inside",i:[["heart",200,122,3.6]],x:"Your heart is a strong muscle about the size of your fist."},
  {bg:"inside",i:[["heart",200,122,2.5],["arrow",72,122,1,{len:50,a:180,c:P_R}],["arrow",328,122,1,{len:50,a:0,c:P_R}],["arrow",200,36,1,{len:40,a:-90,c:P_R}]],x:"It squeezes and relaxes again and again, pumping blood all around your body."},
  {bg:"inside",i:[["lungs",110,122,2.3],["heart",290,128,1.8],["arrow",200,118,1,{len:70,a:0,c:P_B}],["label",110,206,1,{t:"lungs",sz:20}],["label",290,206,1,{t:"heart",sz:20}],["label",200,98,1,{t:"oxygen",sz:18,c:P_DB}]],x:"Blood picks up oxygen in your lungs. Then your heart pumps it to every part of you."},
  {bg:"meadow",i:[["kid",120,170,1.7,{up:true}],["heart",300,112,2],["arrow",232,112,1,{len:32,a:0,c:P_R}],["label",300,184,1,{t:"faster!",sz:22,c:P_R}]],x:"When you run, your muscles need more oxygen. So your heart beats faster to send more blood."}],
  qs:[["What does your heart do?",["Pumps blood around your body","Digests the food that you eat","Helps your eyes to see clearly","Makes your bones grow stronger"],0,"The heart pumps blood to every part of your body."],
      ["What does blood pick up in your lungs?",["Oxygen","Milk","Sand","Sunlight"],0,"Blood picks up oxygen in the lungs."],
      ["Why does your heart beat faster when you run?",["Your muscles need extra oxygen fast","Your heart is excited to go fast","Your blood gets thicker when you run","Your heart gets bigger when you run"],0,"Working muscles need more oxygen, so the heart pumps more blood."]]},
 {id:"earth-layers",t:"Inside the Earth",lvl:4,tags:["earth","space"],pages:[
  {bg:"space",i:[["layers",200,122,2.2]],x:"Earth has layers, a bit like a peach: a skin, then flesh, then a stone in the middle."},
  {bg:"space",i:[["layers",150,122,2.1],["label",320,60,1,{t:"Crust",sz:30,c:"#fff"}],["arrow",268,86,1,{len:60,a:160,c:"#fff"}]],x:"We live on the crust. It is a thin layer of rock, like the skin of an apple."},
  {bg:"space",i:[["layers",150,122,2.1],["label",320,100,1,{t:"Mantle",sz:30,c:"#fff"}],["arrow",270,112,1,{len:60,a:175,c:"#fff"}]],x:"Under the crust is the mantle. It is very hot, thick rock that moves very slowly."},
  {bg:"space",i:[["layers",150,122,2.1],["label",338,150,1,{t:"Core",sz:30,c:"#fff"}],["arrow",244,140,1,{len:84,a:180,c:"#fff"}]],x:"At the center is the core. It is as hot as the surface of the Sun."}],
  qs:[["What is the thin outer layer of Earth where we live?",["The crust","The mantle","The core","The ocean"],0,"We live on the crust."],
      ["Which layer is at the very center of Earth?",["The core","The crust","The mantle","The clouds"],0,"The core is at the center."],
      ["Which layer is between the crust and the core?",["The mantle","The sky","The sea","The snow"],0,"The mantle is between the crust and the core."]]},
 {id:"fossils",t:"Fossils and dinosaurs",lvl:4,tags:["dinosaurs","earth","animals"],pages:[
  {bg:"meadow",i:[["dino",200,150,2.1]],x:"A very long time ago, dinosaurs lived on Earth. No person ever saw one alive."},
  {bg:"dusk",i:[["ground",200,150,1,{c:P_BR}],["ground",200,200,1,{c:"#A9794B"}],["bone",200,204,2.4]],x:"When an animal died, mud or sand sometimes buried its bones."},
  {bg:"plain",i:[["bone",200,118,3.6],["label",200,200,1,{t:"a fossil",sz:30}]],x:"Over millions of years, the buried bones slowly turned to stone. That stone copy is called a fossil."},
  {bg:"meadow",i:[["bird",120,92,2.2],["dino",290,150,1.2],["arrow",200,120,1,{len:50,a:0,c:P_R}]],x:"Scientists dig up fossils to learn how animals looked and lived. They found that birds are living relatives of dinosaurs!"}],
  qs:[["What is a fossil?",["Ancient remains that turned to stone","A kind of dinosaur egg that is hard","A hot rock that comes out of volcanoes","A tool that scientists use for digging"],0,"A fossil is ancient remains that slowly turned to stone."],
      ["How do scientists learn about dinosaurs?",["By studying fossils","By watching them on farms","By reading their diaries","By visiting the Moon"],0,"Fossils show how ancient animals looked and lived."],
      ["Which animal today is a relative of the dinosaurs?",["Birds","Frogs","Fish","Butterflies"],0,"Birds are living relatives of dinosaurs."]]},
 {id:"leaves-color",t:"Why leaves change color",lvl:5,tags:["plants"],pages:[
  {bg:"meadow",i:[["tree",200,150,2.3]],x:"Leaves are green because they hold a green stuff called chlorophyll."},
  {bg:"sky",i:[["leaf",190,128,3.6],["sun",332,52,1.3],["arrow",276,84,1,{len:50,a:150,c:P_Y}]],x:"Chlorophyll helps a leaf catch sunlight and use it to make food for the tree."},
  {bg:"dusk",i:[["tree",200,150,2.3,{c:"#C8D86A"}],["leaf",90,80,.8,{c:"#C8D86A",r:30}],["leaf",320,70,.8,{c:"#C8D86A",r:-20}]],x:"In autumn the days get shorter and cooler. The tree stops making chlorophyll, and the green begins to fade."},
  {bg:"dusk",i:[["tree",90,152,1.6,{c:"#F2A33B"}],["tree",200,152,1.6,{c:"#E0583F"}],["tree",310,152,1.6,{c:"#F2D44B"}]],x:"As the green fades, yellow and orange colors that were hiding in the leaf show up. Some leaves also make red."}],
  qs:[["What makes leaves green?",["Chlorophyll","Paint","Sand","Salt"],0,"Chlorophyll is the green stuff in leaves."],
      ["Why do leaves turn yellow and orange in fall?",["The green fades and hidden colors show","The tree gets sunburned in the autumn","Someone paints each leaf by hand","The wind rubs the color off the leaves"],0,"When the green fades, the yellow and orange that were hiding show up."],
      ["What does chlorophyll help leaves do?",["Make food from sunlight","Make noise","Grow wings","Hold water bottles"],0,"Chlorophyll helps leaves make food from sunlight."]]},
 {id:"plane-fly",t:"How airplanes fly",lvl:5,tags:["machines"],pages:[
  {bg:"sky",i:[["plane",200,112,2.4]],x:"An airplane is much heavier than air, but it flies. How?"},
  {bg:"sky",i:[["wing",200,100,3],["arrow",144,176,1,{len:46,a:90,c:P_B}],["arrow",200,184,1,{len:46,a:90,c:P_B}],["arrow",256,176,1,{len:46,a:90,c:P_B}]],x:"Its wings are shaped and tilted so that they push air downward."},
  {bg:"sky",i:[["wing",200,150,3],["arrow",144,72,1,{len:50,a:-90,c:P_R}],["arrow",200,64,1,{len:50,a:-90,c:P_R}],["arrow",256,72,1,{len:50,a:-90,c:P_R}],["label",330,70,1,{t:"lift",sz:30,c:P_R}]],x:"When the wings push air down, the air pushes the wings up. This push is called lift."},
  {bg:"sky",i:[["plane",150,120,2.1],["arrow",322,120,1,{len:70,a:0,c:P_R}],["label",290,190,1,{t:"engines push forward",sz:18}]],x:"The engines push the plane forward very fast, so plenty of air keeps flowing over the wings."}],
  qs:[["What holds an airplane up in the sky?",["Lift","A giant magnet","Balloons","Gravity"],0,"The air pushes the wings up. That is lift."],
      ["What do an airplane's engines do?",["Push the plane forward","Make the plane float like a boat","Make it lighter than air","Pull clouds in"],0,"Engines push the plane forward so air flows over the wings."],
      ["What do the wings do to the air?",["Push it downward","Eat it","Freeze it","Turn it into water"],0,"Wings push air down, and the air pushes back up."]]},
 {id:"seed-travel",t:"How seeds travel",lvl:2,tags:["plants","animals"],pages:[
  {bg:"meadow",i:[["flower",110,160,1.8,{c:P_PK}],["seed",200,100,1.8],["seed",290,140,1.4],["seed",150,52,1.2]],x:"A plant makes seeds so that new plants can grow. But seeds need room, so they have to travel away from the parent plant."},
  {bg:"sky",i:[["tree",330,140,1.5],["arrow",110,86,1,{len:70,a:0,c:"#fff"}],["arrow",110,126,1,{len:70,a:0,c:"#fff"}],["seed",230,88,1.5,{r:20}],["seed",290,128,1.1,{r:-30}],["cloud",320,38,.8,{}]],x:"Some seeds are very light, with fluffy parts. The wind picks them up and carries them far away."},
  {bg:"meadow",i:[["dog",190,170,1.5],["seed",168,158,.6],["seed",198,154,.6],["seed",226,164,.6],["seed",330,196,.7],["print",110,200,.8]],x:"Some seeds are sticky or have little hooks. They cling to the fur of animals, and later they drop off in a new place."},
  {bg:"meadow",i:[["berry",64,166,1.6],["arrow",128,132,1,{len:44,a:0,c:P_R}],["bird",190,86,1.8],["arrow",262,132,1,{len:44,a:0,c:P_R}],["sprout",335,172,1.1,{stage:2}]],x:"Birds eat sweet berries. The seeds pass through the bird and land far from where it ate, ready to grow."}],
  qs:[["Why do plants send their seeds far away?",["So new plants have room to grow","So the seeds can find a warm bed","So bees will not eat the seeds","So the parent plant stays small"],0,"Seeds that fall right under the parent plant would be crowded, so they travel to find room."],
      ["How do light, fluffy seeds travel?",["The wind carries them far away","They hop along on tiny legs","They swim up rivers like fish","They roll down long hills alone"],0,"Light, fluffy seeds are carried by the wind."],
      ["How do sticky, hooked seeds travel?",["They stick to the fur of animals","The rain washes them to far lands","They are blown away by strong wind","They fall straight down from the sky"],0,"Hooks and sticky coats let seeds cling to passing animals."]]},
 {id:"seasons",t:"Why we have seasons",lvl:4,tags:["space","earth"],pages:[
  {bg:"space",i:[["sun",200,120,1.1,{plain:true}],["orbit",200,120,1,{r:92}],["earth",200,28,.5],["earth",292,120,.5],["earth",200,212,.5],["earth",108,120,.5]],x:"Earth travels in a giant circle around the Sun. One trip takes one year."},
  {bg:"space",i:[["earth",200,120,2.4,{r:23}],["wire",200,120,1,{pts:"37,-96 -37,96",c:P_Y}],["label",320,50,1,{t:"tilted",sz:24,c:"#fff"}]],x:"Earth is tilted, like a spinning top that leans a little. It always leans the same way as it travels."},
  {bg:"space",i:[["sun",50,120,1.4,{plain:true}],["earth",250,112,2.1,{r:23,dark:"right"}],["label",250,222,1,{t:"leaning toward the Sun: summer",sz:15,c:"#fff"}]],x:"When our part of Earth leans toward the Sun, sunlight is stronger and the days are longer. That is summer."},
  {bg:"space",i:[["sun",50,120,1.4,{plain:true}],["earth",250,112,2.1,{r:-23,dark:"right"}],["label",250,222,1,{t:"leaning away from the Sun: winter",sz:15,c:"#fff"}]],x:"When our part of Earth leans away from the Sun, sunlight is weaker and the days are shorter. That is winter."}],
  qs:[["How long does Earth take to travel once around the Sun?",["One year","One day","One month","One week"],0,"One trip around the Sun is one year."],
      ["What causes the seasons?",["Earth is tilted as it goes around the Sun","Earth moves closer to and farther from the Sun","The Sun burns hotter and then colder","The Moon blocks the Sun for months"],0,"Because Earth is tilted, different parts get more or less direct sunlight during the year."],
      ["When our part of Earth leans toward the Sun, it is...",["Summer","Winter","A full moon","The middle of night"],0,"Leaning toward the Sun means stronger sunlight and longer days: summer."]]},
 {id:"ice-floats",t:"Why ice floats",lvl:3,tags:["ocean","earth"],pages:[
  {bg:"plain",i:[["thermo",80,112,1.5],["label",80,200,1,{t:"0°C",sz:22}],["drop",190,112,2.2],["arrow",250,112,1,{len:46,a:0,c:P_B}],["ice",325,112,1.6]],x:"Water can be a liquid, a solid or a gas. When water gets cold enough, it freezes into solid ice."},
  {bg:"plain",i:[["drop",110,106,2.2],["label",110,190,1,{t:"water",sz:20}],["ice",285,106,2.1],["label",285,190,1,{t:"the same water, frozen",sz:15}]],x:"When water freezes, it spreads out and takes up more room. So ice is a little lighter than the same amount of liquid water."},
  {bg:"water",i:[["ice",90,100,1.5],["ice",200,102,1.3],["ice",310,104,1.1],["fish",160,190,.9]],x:"Because ice is lighter than water, it floats on top. That is why a lake freezes from the top down."},
  {bg:"deep",i:[["ice",40,24,1.3],["ice",120,24,1.3],["ice",200,24,1.3],["ice",280,24,1.3],["ice",360,24,1.3],["fish",200,150,2],["bubbles",110,150,1.6]],x:"The ice on top works like a blanket. Under it, the water stays liquid, so fish can swim all winter long."}],
  qs:[["Why does ice float on water?",["Ice is lighter than the same water","Ice is filled with a lot of air","Ice is colder than the water","Ice is stuck to the lake's edges"],0,"Water spreads out when it freezes, so ice is lighter than the same amount of liquid water."],
      ["What happens to water when it freezes?",["It spreads out and takes more room","It shrinks down into a smaller space","It turns into an invisible gas","It gets much heavier and sinks"],0,"Freezing water spreads out and takes up more room."],
      ["Why can fish live under a frozen lake?",["The water under the ice stays liquid","The fish freeze but wake up in spring","The fish dig tunnels through the ice","The fish eat the ice to stay warm"],0,"The ice on top keeps the water below from freezing, so the fish can still swim."]]},
 {id:"food-chain",t:"A food chain",lvl:2,tags:["animals","plants"],pages:[
  {bg:"meadow",i:[["sun",330,48,1.3],["grass",110,196,2.4],["grass",260,200,2.4],["sparkle",200,120,1.4]],x:"Plants make their own food from sunlight, water and air. Many animals depend on plants for their food."},

/* a seeded shuffle so the three offered activities rotate in a different order each cycle */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function perm(n,seed){var a=[],i,r=rng(seed);for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
/* three activities a day, rotating so every one comes round; the rest are one tap away */
function modsFor(si,key){
  var all=ST[si].mods,n=all.length,dn=dayNum(key);
  if(n<=3)return {main:all.slice(),more:[]};
  var cyc=Math.floor(dn*3/n),p=perm(n,cyc*7919+si*104729+13),start=(dn*3)%n,main=[],t;
  for(t=0;t<3;t++)main.push(all[p[(start+t)%n]]);
  return {main:main,more:all.filter(function(id){return main.indexOf(id)<0;})};
}

var AC=null;
function unlockAudio(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended"&&AC.resume)AC.resume();
  }catch(e){}
}
/* iPad keeps audio locked until a tap, so unlock on the first one */
document.addEventListener("pointerdown",unlockAudio,{passive:true});

/* a small family of soft sounds; every one respects the mute switch */
function tone(list,type,vol){
  if(store.get("mute",false))return;
  try{
    unlockAudio();if(!AC)return;
    var t=AC.currentTime;
    list.forEach(function(n){
      var o=AC.createOscillator(),g=AC.createGain(),at=t+n[1],dur=n[2]||.3;
      o.type=type||"sine";o.frequency.value=n[0];
      g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol||.15,at+.015);
      g.gain.exponentialRampToValueAtTime(.001,at+dur);
      o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+dur+.05);
    });
  }catch(e){}
}

function burst(count){
  try{if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var box=document.createElement("div"),cols=["#F28B6B","#F7B955","#8FD3B6","#8FB6F0","#C6A4F0"],i;
  box.className="confetti";
  for(i=0;i<(count||30);i++){
    var p=document.createElement("i");
    if(i%3===0)p.className="s";
    p.style.left=(8+Math.random()*84)+"%";p.style.background=cols[i%5];
    p.style.animationDelay=(Math.random()*.3)+"s";p.style.setProperty("--dx",(Math.random()*180-90)+"px");
