   '<label class="field">What they did<textarea id="sWhat" placeholder="Finished the grade 3 multiplication page in 15 minutes without help"></textarea></label>'+
   '<label class="field">Teacher\'s note, if there is one<input type="text" id="sNote" maxlength="200"></label>'+
   '<div class="row" style="margin-top:12px"><button class="btn sm" id="sAdd" type="button">Add sample</button>'+
   '<button class="btn sm alt" id="sCopy" type="button">Copy all samples</button><span class="said" id="sSaid" hidden>Copied</span></div>'+
   '<pre class="letter" id="sFb" hidden></pre>'+
   '<div id="sList">'+(samples.length?samples.slice().reverse().map(function(s,ri){
      var idx=samples.length-1-ri;
      return '<div class="sample"><b>'+esc(s.d)+'</b><div>'+esc(s.w)+'</div>'+(s.n?'<div>Teacher: '+esc(s.n)+'</div>':'')+
        '<button class="link" data-del="'+idx+'" type="button">Remove</button></div>';}).join(""):
      '<p style="margin-top:12px">Nothing yet.</p>')+'</div>'+
   '<h3>Ask the teacher for above-grade work</h3><p>Fill in the bracket and send it as it is, or change anything you like.</p>'+
   '<div class="letter" id="tLetter"></div>'+
   '<div class="row" style="margin-top:12px"><button class="btn sm" id="tCopy" type="button">Copy this message</button><span class="said" id="tSaid" hidden>Copied</span></div>'+
   '<pre class="letter" id="tFb" hidden></pre>';

  var paneSettings=
   '<h3>Settings</h3><div class="fields">'+
   '<label class="field">Child\'s name<input type="text" id="gChild" maxlength="20"></label>'+
   '<label class="field">Helper name<input type="text" id="gName" maxlength="14"></label>'+
   '<label class="field">What they are into (one choice every other day will use it)<input type="text" id="gLike" maxlength="24"></label>'+
   '<label class="field">An important date, like a school assessment (the 7 days before it become an easy week)<input type="date" id="evDate"></label>'+
   '<label class="field">Weekly treasure<input type="text" id="reward" maxlength="40"></label>'+
   '<label class="field">Stars for the treasure (3 to 28)<input type="number" id="goal" min="3" max="28" inputmode="numeric"></label>'+
   '<label class="field">Your name, for the message in Records<input type="text" id="gMe" maxlength="24"></label>'+
   '<label class="field">A math result to mention, if you like<input type="text" id="gMath" maxlength="80" placeholder="e.g. was above the 80th percentile on the fall test"></label></div>'+
   '<h3>Word Jar</h3>'+(words.length?'<p>Tap a word to take it out, for example after a typo.</p><div class="chips">'+words.map(function(w,wi){
      return '<button class="chip rm" data-rmw="'+wi+'" type="button" aria-label="Remove '+esc(w.w)+'">'+esc(w.w)+' <b aria-hidden="true">&times;</b></button>';}).join("")+'</div>':'<p>No words yet.</p>');

  var paneHelp=
   (storageOK?'':'<div class="note"><b>This browser is not saving anything.</b> Check that cookies and site data are allowed for this page, and that private browsing is off. Until then, progress only lasts while the page stays open.</div>')+
   '<h3>Back up and restore</h3><p>Everything is saved only in this browser. Back it up before clearing browser data, or to move it to another device. If you add this page to the Home Screen, set it up from the Home Screen icon, because that keeps its own separate storage. Use a backup to carry things across.</p>'+
   '<div class="row" style="margin-top:12px"><button class="btn sm" id="bkCopy" type="button">Copy a backup</button><span class="said" id="bkSaid" hidden>Copied</span></div>'+
   '<pre class="letter" id="bkFb" hidden></pre>'+
   '<label class="field">Paste a backup here to restore it<textarea id="rsText"></textarea></label>'+
   '<div class="row" style="margin-top:12px"><button class="btn sm alt" id="rsGo" type="button">Restore</button><span class="said" id="rsMsg" role="status"></span></div>';

  var paneProgress=progressPane();
  var panes=[paneToday,paneProgress,paneRecords,paneSettings,paneHelp];
  elG.innerHTML=
   '<button class="back" id="gback" type="button">&larr; Back to the workshop</button>'+
   '<h2 id="gTop" tabindex="-1">For grown-ups</h2>'+
   '<div class="note"><b>What this page is.</b> Four stations, all played on the screen: picture stories and word games, picture lessons, puzzles and mazes, and number work. It adjusts to him as he plays. It builds reading, vocabulary, knowledge, logic and math. It is not a copy of any test, and it cannot promise a result. The Progress tab shows what he can do, which is useful evidence to share with the school.</div>'+
   '<div class="tabs" role="tablist">'+G_TABS.map(function(n,ti){
      return '<button type="button" role="tab" id="tab'+ti+'" data-tab="'+ti+'" aria-selected="'+(ti===gTab)+'" aria-controls="gp'+ti+'">'+n+'</button>';}).join("")+'</div>'+
   panes.map(function(p,pi){return '<div role="tabpanel" id="gp'+pi+'" aria-labelledby="tab'+pi+'"'+(pi===gTab?'':' hidden')+'>'+p+'</div>';}).join("");
  [].forEach.call(elG.querySelectorAll("[data-tab]"),function(b){
    b.addEventListener("click",function(){
      gTab=+b.getAttribute("data-tab");
      [].forEach.call(elG.querySelectorAll("[data-tab]"),function(o){o.setAttribute("aria-selected",String(o===b));});
      [].forEach.call(elG.querySelectorAll("[role=tabpanel]"),function(p,pi){p.hidden=pi!==gTab;});
    });
  });
  document.getElementById("tLetter").textContent=teacherText();
  var gChild=document.getElementById("gChild"),gMe=document.getElementById("gMe"),gMath=document.getElementById("gMath"),
      gName=document.getElementById("gName"),gLike=document.getElementById("gLike"),evDate=document.getElementById("evDate"),
      rw=document.getElementById("reward"),gl=document.getElementById("goal");
  gChild.value=store.get("child","");gMe.value=store.get("parent","");gMath.value=store.get("maths","");gName.value=store.get("name","");
  gLike.value=store.get("interest","");evDate.value=store.get("evalDate","");
  rw.value=store.get("reward","Weekend treat");gl.value=goalStars();
  function paintLetter(){document.getElementById("tLetter").textContent=teacherText();}
  gName.addEventListener("input",function(){store.set("name",gName.value.trim());});
  gChild.addEventListener("input",function(){store.set("child",gChild.value.trim());paintLetter();});
  gMe.addEventListener("input",function(){store.set("parent",gMe.value.trim());paintLetter();});
  gMath.addEventListener("input",function(){store.set("maths",gMath.value.trim());paintLetter();});
  gLike.addEventListener("input",function(){store.set("interest",gLike.value.trim());});
  evDate.addEventListener("change",function(){store.set("evalDate",evDate.value);});
  rw.addEventListener("input",function(){store.set("reward",rw.value||"Weekend treat");});
  gl.addEventListener("change",function(){var v=parseInt(gl.value,10);if(isNaN(v))v=12;v=Math.max(3,Math.min(28,v));gl.value=v;store.set("goal",v);});
  document.getElementById("gback").addEventListener("click",goHome);
  var gt=document.getElementById("giveT");
  if(gt)gt.addEventListener("click",function(){store.set("claimed",store.get("claimed",0)+goalStars());renderGrown();});
  /* undoing a star also takes back the sticker that star earned */
  [].forEach.call(elG.querySelectorAll("[data-undo]"),function(b){
    b.addEventListener("click",function(){
      var all=days(),sid=b.getAttribute("data-undo");
      if(all[k]&&typeof all[k]==="object"){
        var e=all[k][sid];
        if(e&&e.k){var st=store.get("stickers",{});if(Number(e.f)>0)st[e.k]=Number(e.f);else delete st[e.k];store.set("stickers",st);}
        delete all[k][sid];store.set("days",all);
      }
      renderGrown();
    });
  });
  [].forEach.call(elG.querySelectorAll("[data-rmw]"),function(b){
    b.addEventListener("click",function(){var list=store.get("words",[]);list.splice(+b.getAttribute("data-rmw"),1);store.set("words",list);renderGrown();});
  });
  document.getElementById("sAdd").addEventListener("click",function(){
    var w=document.getElementById("sWhat").value.trim(),n=document.getElementById("sNote").value.trim();
    if(!w){document.getElementById("sWhat").focus();return;}
    var list=store.get("samples",[]);list.push({d:todayKey(),w:w,n:n});store.set("samples",list);
    renderGrown();document.getElementById("sList").scrollIntoView({block:"nearest"});
  });
  [].forEach.call(elG.querySelectorAll("[data-del]"),function(b){
    var armed=false,tm=null;
    b.addEventListener("click",function(){
      if(!armed){armed=true;b.textContent="Tap again to remove";tm=setTimeout(function(){armed=false;b.textContent="Remove";},3000);return;}
      clearTimeout(tm);var list=store.get("samples",[]);list.splice(+b.getAttribute("data-del"),1);store.set("samples",list);renderGrown();
    });
  });
  document.getElementById("sCopy").addEventListener("click",function(){
    var list=store.get("samples",[]);
    var text="Work samples"+(store.get("child","")?" for "+store.get("child",""):"")+"\n\n"+(list.length?list.map(function(s,i){return (i+1)+". "+s.d+": "+s.w+(s.n?"\n   Teacher's note: "+s.n:"");}).join("\n\n"):"(none yet)");
    copyText(text,document.getElementById("sSaid"),document.getElementById("sFb"));
  });
  document.getElementById("tCopy").addEventListener("click",function(){
    copyText(teacherText(),document.getElementById("tSaid"),document.getElementById("tFb"));
  });
  document.getElementById("prCopy").addEventListener("click",function(){
    copyText(progressText(),document.getElementById("prSaid"),document.getElementById("prFb"));
  });
  document.getElementById("bkCopy").addEventListener("click",function(){
    copyText(backupText(),document.getElementById("bkSaid"),document.getElementById("bkFb"));
  });
  document.getElementById("rsGo").addEventListener("click",function(){
    var ok=restoreFrom(document.getElementById("rsText").value.trim());
    if(ok){renderGrown();document.getElementById("rsMsg").textContent="Restored.";}
    else document.getElementById("rsMsg").textContent="That does not look like a backup from this page.";
  });
}

renderHome(true);
</script>

<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
