<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workshop">
<meta name="theme-color" content="#F3F6F2">
<meta name="description" content="A small daily workshop for a young child: read, build, explain and play with numbers.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%232FB8A6' stroke='%2314221E' stroke-width='4'/%3E%3Ccircle cx='24' cy='30' r='7' fill='white' stroke='%2314221E' stroke-width='3'/%3E%3Ccircle cx='42' cy='30' r='7' fill='white' stroke='%2314221E' stroke-width='3'/%3E%3Cpath d='M22 43q10 8 20 0' fill='none' stroke='%2314221E' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Home Workshop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a sticker-book workshop. A robot helper stands on a pegboard wall with
   today's star tray under it, four illustrated stations sit in a 2x2 grid, and every
   station is pick-one-of-three, then one how-to with tap-to-tick steps and one big
   button. Chunky outlines and hard offset shadows make every target look pressable;
   motion is slow and sparing, and switches off for reduced-motion settings. */
:root{
  --bg:#F3F6F2; --card:#FFFFFF; --sunk:#E5EBE6;
  --ink:#14221E; --ink2:#43524C; --ink3:#55635D; --line:#D3DCD7;
  --edge:#14221E; --sh:#14221E;
  --btn:#1B5E52; --btn-ink:#FFFFFF;
  --hero:#DCEFEA; --dot:rgba(20,34,30,.13);
  --star:#F2B600; --star-line:#14221E;
  --read:#2F63B5;    --read-w:#E3EDFB;
  --build:#8F5C0E;   --build-w:#FBEBCF;
  --explain:#25704F; --explain-w:#DDF3E8;
  --nums:#7446AE;    --nums-w:#EDE3F8;
  --ff-d:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --ff-b:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --card:#17211E; --sunk:#1D2927;
  --ink:#E9F1ED; --ink2:#A9B7B0; --ink3:#8898A1; --line:#2B3834;
  --edge:#5E7A70; --sh:#050908;
  --btn:#6FCB9C; --btn-ink:#0B1F17;
  --hero:#13262A; --dot:rgba(255,255,255,.08);
  --star:#F4C020; --star-line:#14221E;
  --read:#8DB3EC;    --read-w:#16233A;
  --build:#E3A951;   --build-w:#2B2112;
  --explain:#74CFA0; --explain-w:#14281F;
  --nums:#BE9FEA;    --nums-w:#241B33;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1715; --card:#17211E; --sunk:#1D2927;
  --ink:#E9F1ED; --ink2:#A9B7B0; --ink3:#8898A1; --line:#2B3834;
  --edge:#5E7A70; --sh:#050908;
  --btn:#6FCB9C; --btn-ink:#0B1F17;
  --hero:#13262A; --dot:rgba(255,255,255,.08);
  --star:#F4C020; --star-line:#14221E;
  --read:#8DB3EC;    --read-w:#16233A;
  --build:#E3A951;   --build-w:#2B2112;
  --explain:#74CFA0; --explain-w:#14281F;
  --nums:#BE9FEA;    --nums-w:#241B33;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ff-b);font-size:18px;line-height:1.55;
  -webkit-text-size-adjust:100%}
.app{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:18px 60px}
h1,h2,h3{font-family:var(--ff-d);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1:focus,h2:focus{outline:none}
h2{font-size:clamp(28px,6.5vw,38px);font-weight:800;line-height:1.08}
h3{font-size:22px;font-weight:600;line-height:1.2}
p{margin:0 0 12px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--btn);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* every screen arrives with a short, soft rise */
.view:not([hidden]){animation:rise .32s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* sticker = anything the child can press: hard shadow, springy press */
.sticker{border:3px solid var(--edge);box-shadow:0 6px 0 var(--sh);border-radius:22px;
  transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s}
@media (hover:hover){button.sticker:hover{transform:translateY(-3px) rotate(-.3deg);box-shadow:0 9px 0 var(--sh)}}
.sticker:active,button.sticker:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}

.panel{border:3px solid var(--edge);box-shadow:0 6px 0 var(--sh);border-radius:22px}

/* ---- top bar ---- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--card);padding:5px 16px 5px 9px;min-height:48px;
  font-family:var(--ff-d);font-weight:600;font-size:17px;color:var(--ink);border-radius:99px;box-shadow:0 4px 0 var(--sh)}
.pill b{font-weight:800}
.mini{background:none;border:0;color:var(--ink3);font-size:15px;padding:8px 10px;min-height:44px;
  display:inline-flex;gap:6px;align-items:center}

/* ---- hero: the pegboard wall ---- */
.hero{padding:18px 18px 18px;background-color:var(--hero);
  background-image:radial-gradient(circle at 2px 2px,var(--dot) 1.9px,transparent 2.1px);background-size:24px 24px}
.hello{display:flex;gap:14px;align-items:center}
.hello .mas{flex:none;display:flex;flex-direction:column;align-items:center}
.nametag{font-family:var(--ff-d);font-weight:600;font-size:16px;color:var(--ink2);margin-top:2px}
.bubble{position:relative;flex:1 1 auto;min-width:0;background:var(--card);border:3px solid var(--edge);
  border-radius:22px;padding:14px 18px;box-shadow:0 5px 0 var(--sh);
  font-family:var(--ff-d);font-weight:600;font-size:clamp(20px,4.6vw,26px);line-height:1.25;
  animation:bubbleIn .4s cubic-bezier(.16,1,.3,1) backwards;transform-origin:left center}
@keyframes bubbleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.bubble::before{content:"";position:absolute;left:-13px;top:34px;width:20px;height:20px;background:var(--card);
  border-left:3px solid var(--edge);border-bottom:3px solid var(--edge);transform:rotate(45deg)}
.warn{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--build-w);border:2.5px solid var(--build);
  font-size:16px;color:var(--ink)}

/* the helper is alive, but only a little: a slow bob, a rare blink, a glowing bulb */
.m-all,.m-eyes,.m-bulb{transform-box:fill-box;transform-origin:center}
.m-pupils{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .3s ease-out}
.mas.alive .m-all{animation:bob 3.8s ease-in-out infinite}
.mas.alive .m-eyes{animation:blink 5.6s infinite}
.mas.alive .m-bulb{animation:glow 2.8s ease-in-out infinite}
.mas.hop .m-all{animation:hop .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}22%{transform:translateY(3px) scale(1.07,.9)}55%{transform:translateY(-16px) scale(.95,1.07)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1,1)}}

/* ---- today's star tray ---- */
.tray{display:flex;align-items:center;gap:10px;margin-top:16px;padding:7px 16px 7px 18px;background:var(--card);
  border:3px solid var(--edge);border-radius:99px;width:max-content;max-width:100%;box-shadow:0 4px 0 var(--sh)}
.tray .lbl{font-family:var(--ff-d);font-weight:600;font-size:18px;margin-right:2px}
.tray .slot{display:inline-flex}
.tray svg{width:36px;height:36px}
.tray .slot.new svg{animation:pop .6s cubic-bezier(.3,1.5,.5,1)}

/* ---- treasure ---- */
.week{margin-top:22px;display:flex;gap:16px;align-items:center;padding:16px 18px;background:var(--card)}
.week .tx{flex:1;min-width:0}
.week b{font-family:var(--ff-d);font-weight:600;font-size:20px;display:block;line-height:1.2}
.week small{color:var(--ink2);font-size:16px}
.bar{height:14px;border-radius:99px;background:var(--sunk);margin-top:10px;overflow:hidden;border:2px solid var(--edge)}
.bar i{display:block;width:100%;height:100%;background:var(--star);transform-origin:left;transition:transform .5s cubic-bezier(.16,1,.3,1)}

/* ---- stations ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:20px;margin-top:26px}
.grid.in .st{animation:tileIn .5s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--i,0)*80ms)}
@keyframes tileIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.st{position:relative;display:flex;gap:14px;align-items:center;text-align:left;padding:16px 16px 16px 14px;
  min-height:128px;background:var(--w);color:var(--ink)}
.st .ic{flex:none;width:72px;height:72px}
.st .tx{min-width:0;display:flex;flex-direction:column;gap:3px}
.st .nm{font-family:var(--ff-d);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.st .tg{font-size:17px;color:var(--ink2);line-height:1.3}
.st .mn{font-size:15px;color:var(--ink3);margin-top:3px}
.st.done{background:var(--card)}
.st.done .nm{color:var(--ink3)}
.st .badge{position:absolute;top:-13px;right:14px;background:var(--star);color:#14221E;font-family:var(--ff-d);
  font-weight:800;font-size:15px;padding:4px 12px;border-radius:99px;border:3px solid var(--edge)}
.st .tick{display:inline-flex;align-items:center;gap:6px;color:var(--c);font-weight:700;font-size:16px}
.endday{margin-top:26px;padding:18px;background:var(--explain-w);text-align:center;
  font-family:var(--ff-d);font-weight:800;font-size:24px;line-height:1.2}
.gate{display:block;margin:38px auto 0;background:none;border:2px dashed var(--line);color:var(--ink3);
  padding:10px 20px;border-radius:99px;font-size:15px;min-height:46px;user-select:none;-webkit-user-select:none;touch-action:none}
.gate[data-hold="1"]{border-style:solid;border-color:var(--btn);color:var(--ink)}

/* ---- welcome: one question at a time ---- */
.welcome{margin-top:24px;padding:20px;background:var(--card)}
.steps3{display:flex;gap:8px;margin-bottom:14px}
.steps3 i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--edge);background:var(--card);display:block}
.steps3 i.on{background:var(--btn)}
.welcome label{display:block;font-family:var(--ff-d);font-weight:800;font-size:clamp(26px,6vw,32px);line-height:1.1}
.welcome input[type=text]{width:100%;margin-top:14px;font-family:inherit;font-size:22px;padding:14px 16px;min-height:60px;
  border-radius:16px;border:3px solid var(--line);background:var(--sunk);color:var(--ink)}
.welcome input:focus{outline:none;border-color:var(--btn)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:8px 16px;min-height:44px;border-radius:99px;background:var(--card);border:2.5px solid var(--edge);
  font-size:17px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.chip.static{background:var(--read-w);border-color:var(--read);min-height:0;padding:5px 14px}
.chip.rm{display:inline-flex;align-items:center;gap:8px;background:var(--read-w);border-color:var(--read);min-height:44px;padding:4px 8px 4px 14px;font-size:16px}
.chip.rm b{font-weight:700;font-size:20px;line-height:1;padding:0 6px}

/* ---- station screen ---- */
.back{background:none;border:0;color:var(--ink2);padding:10px 4px;min-height:46px;font-size:18px}
.sthead{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.sthead .ic{width:64px;height:64px;flex:none}
.sthead h2{color:var(--c)}
.pick{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;min-height:78px;background:var(--card);color:var(--ink)}
.pick .opt{animation:tileIn .45s cubic-bezier(.16,1,.3,1) backwards}
.pick .opt:nth-child(2){animation-delay:70ms}.pick .opt:nth-child(3){animation-delay:140ms}
.opt b{font-family:var(--ff-d);font-size:23px;font-weight:600;display:block;line-height:1.2}
.opt .d{color:var(--ink2);font-size:17px;display:block;margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;background:var(--sunk);font-size:14.5px;color:var(--ink2);max-width:100%}
.tag.ok{background:var(--explain-w);color:var(--ink)}
.how{margin-top:20px;padding:20px;background:var(--w)}
.how ol{margin:10px 0 0;padding:0;list-style:none}
.step{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:9px 0;
  min-height:58px;font-size:21px;line-height:1.5;color:var(--ink)}
.step .num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-family:var(--ff-d);font-weight:800;font-size:19px;
  transition:transform .18s cubic-bezier(.3,1.7,.5,1),background .15s;margin-top:1px}
.step:active .num{transform:scale(.86)}
.step.on .num{background:var(--btn);color:var(--btn-ink);transform:scale(1.08)}
.step.on .stx{color:var(--ink2)}
.need{margin-top:8px;color:var(--ink2);font-size:17px}
.twist{margin:12px 0 0;color:var(--ink2);font-size:17px}
.twist b{color:var(--ink)}
.stretch{margin-top:14px;padding:12px 16px;border-radius:14px;background:var(--card);border:2.5px dashed var(--edge);font-size:18px}
.btn{font-family:var(--ff-d);font-weight:800;font-size:24px;padding:16px 30px;min-height:64px;border-radius:99px;
  background:var(--btn);color:var(--btn-ink);border:3px solid var(--edge);box-shadow:0 6px 0 var(--sh);
  transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.btn.sm{font-family:var(--ff-b);font-weight:700;font-size:17px;padding:10px 18px;min-height:50px;box-shadow:0 4px 0 var(--sh)}
.btn.alt{background:var(--card);color:var(--ink)}
.btn.ready{animation:ready 1.7s ease-in-out infinite}
@keyframes ready{0%,100%{box-shadow:0 6px 0 var(--sh),0 0 0 0 rgba(47,184,166,.0)}50%{box-shadow:0 6px 0 var(--sh),0 0 0 9px rgba(47,184,166,.28)}}
.row{display:flex;flex-wrap:wrap;gap:16px 14px;align-items:center;margin-top:24px}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;padding:12px 6px;min-height:46px;font-size:17px}
.ico{display:inline-flex;align-items:center;gap:8px}
.timer{display:flex;gap:14px;align-items:center;margin-top:16px}
.timer svg{width:74px;height:74px}
.timer .t{font-family:var(--ff-d);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.earned{margin-top:18px;padding:22px;background:var(--card);text-align:center}
.earned .big{display:flex;justify-content:center;margin-bottom:6px}
.earned .big svg{width:76px;height:76px;animation:pop .55s ease-out}
.earned .sub{color:var(--ink2);margin:6px 0 0;font-size:17px}
.reveal{display:flex;justify-content:center;align-items:center;position:relative;margin:2px 0 6px;height:150px}
.reveal::before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,226,122,.75),rgba(255,226,122,0) 66%);animation:glowin 1s ease-out}
.reveal svg{position:relative;width:132px;height:132px;filter:drop-shadow(0 5px 0 var(--sh));
  animation:peel .75s cubic-bezier(.3,1.5,.5,1)}
@keyframes peel{0%{transform:scale(.2) rotate(-45deg);opacity:0}60%{transform:scale(1.14) rotate(7deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes glowin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.wig{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-size:18px;color:var(--ink2)}
.wig b{color:var(--ink)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
.jar{margin-top:34px;padding:18px;background:var(--card)}
.jar form{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.jar input[type=text]{flex:1 1 180px;min-width:0;font-family:inherit;font-size:20px;padding:12px 14px;min-height:54px;
  border-radius:14px;border:3px solid var(--line);background:var(--sunk);color:var(--ink)}
.jar input:focus{outline:none;border-color:var(--read)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-18px;width:10px;height:15px;border-radius:2px;animation:fall 1.9s ease-in forwards}
.confetti i.s{width:17px;height:17px;border-radius:0;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(560deg)}}

/* ---- sticker album ---- */
.albhead{margin:4px 0 0}
.albsub{color:var(--ink2);margin:6px 0 0;font-size:18px}
.meter{height:14px;border-radius:99px;background:var(--sunk);margin:12px 0 0;overflow:hidden;border:2px solid var(--edge)}
.meter i{display:block;width:100%;height:100%;background:var(--star);transform-origin:left}
.albsec{margin-top:26px;padding:16px 16px 18px;background:var(--w)}
.albsec h3{color:var(--c);font-size:26px;font-weight:800}
.stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px 12px;margin-top:12px}
.stk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.stk svg{width:92px;height:92px;filter:drop-shadow(0 3px 0 var(--sh))}
.stk.locked svg{filter:none}
.stk .nm{font-family:var(--ff-d);font-weight:600;font-size:16px;line-height:1.2}
.stk .lv{font-size:14px;color:var(--ink2)}
.stk.locked .nm{color:var(--ink3)}

/* ---- grown-ups ---- */
.g h3{margin:32px 0 8px}
.g p,.g li{color:var(--ink2);font-size:16.5px;max-width:64ch}
.g ul{padding-left:20px;margin:8px 0 0}
.g li{margin-bottom:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tabs button{min-height:46px;padding:8px 18px;border-radius:99px;border:2.5px solid var(--edge);background:var(--card);
  font-weight:700;font-size:16px;color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.note{padding:14px 16px;border-radius:14px;background:var(--sunk);font-size:16px;color:var(--ink2);margin-top:14px}
.note b{color:var(--ink)}
.note.ok{background:var(--explain-w);border:2.5px solid var(--explain);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px;font-size:15.5px;color:var(--ink2)}
.field input,.field textarea{font-family:inherit;font-size:17px;padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:46px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 16px}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{border-collapse:collapse;width:100%;min-width:340px;font-size:15.5px}
.tbl td{padding:7px 12px 7px 0;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.tbl td b{color:var(--ink)}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.on.read{background:var(--read);border-color:var(--read)}
.dots i.on.build{background:var(--build);border-color:var(--build)}
.dots i.on.explain{background:var(--explain);border-color:var(--explain)}
.dots i.on.nums{background:var(--nums);border-color:var(--nums)}
.sample{padding:12px 0;border-bottom:1px solid var(--line)}
.sample b{color:var(--ink);font-size:16px}
.sample div{font-size:16px;color:var(--ink2)}
.letter{white-space:pre-wrap;background:var(--sunk);padding:14px 16px;border-radius:12px;font-size:15.5px;

var AC=null;

/* a small family of soft sounds; every one respects the mute switch */
function tone(list,type,vol){
  if(store.get("mute",false))return;
  try{
    unlockAudio();if(!AC)return;
    var t=AC.currentTime;
    list.forEach(function(n){
      var o=AC.createOscillator(),g=AC.createGain(),at=t+n[1],dur=n[2]||.3;
      o.type=type||"sine";o.frequency.value=n[0];
      g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol||.15,at+.015);
      g.gain.exponentialRampToValueAtTime(.001,at+dur);
      o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+dur+.05);
    });
  }catch(e){}
}

  var box=document.createElement("div"),cols=["#F28B6B","#F7B955","#8FD3B6","#8FB6F0","#C6A4F0"],i;

  var box=document.getElementById("timerBox");if(!box)return;
  if(!timer.total){box.innerHTML="";return;}

}

   '<label class="field">Helper name<input type="text" id="gName" maxlength="14"></label>'+
   '<label class="field">What they are into (one choice every other day will use it)<input type="text" id="gLike" maxlength="24"></label>'+
   '<label class="field">An important date, like a school assessment (the 7 days before it become an easy week)<input type="date" id="evDate"></label>'+
   '<label class="field">Weekly treasure<input type="text" id="reward" maxlength="40"></label>'+
   '<label class="field">Stars for the treasure (3 to 28)<input type="number" id="goal" min="3" max="28" inputmode="numeric"></label>'+
   '<label class="field">Your name, for the message in Records<input type="text" id="gMe" maxlength="24"></label>'+
   '<label class="field">A math result to mention, if you like<input type="text" id="gMath" maxlength="80" placeholder="e.g. was above the 80th percentile on the fall test"></label></div>'+
   '<h3>Word Jar</h3>'+(words.length?'<p>Tap a word to take it out, for example after a typo.</p><div class="chips">'+words.map(function(w,wi){
      return '<button class="chip rm" data-rmw="'+wi+'" type="button" aria-label="Remove '+esc(w.w)+'">'+esc(w.w)+' <b aria-hidden="true">&times;</b></button>';}).join("")+'</div>':'<p>No words yet.</p>');

  var paneHelp=
   (storageOK?'':'<div class="note"><b>This browser is not saving anything.</b> Check that cookies and site data are allowed for this page, and that private browsing is off. Until then, progress only lasts while the page stays open.</div>')+
   '<h3>Back up and restore</h3><p>Everything is saved only in this browser. Back it up before clearing browser data, or to move it to another device. If you add this page to the Home Screen, set it up from the Home Screen icon, because that keeps its own separate storage. Use a backup to carry things across.</p>'+
   '<div class="row" style="margin-top:12px"><button class="btn sm" id="bkCopy" type="button">Copy a backup</button><span class="said" id="bkSaid" hidden>Copied</span></div>'+
   '<pre class="letter" id="bkFb" hidden></pre>'+
   '<label class="field">Paste a backup here to restore it<textarea id="rsText"></textarea></label>'+
   '<div class="row" style="margin-top:12px"><button class="btn sm alt" id="rsGo" type="button">Restore</button><span class="said" id="rsMsg" role="status"></span></div>';

  var panes=[paneToday,paneRecords,paneSettings,paneHelp];
  elG.innerHTML=
   '<button class="back" id="gback" type="button">&larr; Back to the workshop</button>'+
   '<h2 id="gTop" tabindex="-1">For grown-ups</h2>'+
   '<div class="note"><b>This page has no test questions, on purpose.</b> Everything here is ordinary reading, vocabulary, knowledge, building and math. Drilling the content of a formal assessment can undermine it, so the page does not do that.</div>'+
   '<div class="tabs" role="tablist">'+G_TABS.map(function(n,ti){
      return '<button type="button" role="tab" id="tab'+ti+'" data-tab="'+ti+'" aria-selected="'+(ti===gTab)+'" aria-controls="gp'+ti+'">'+n+'</button>';}).join("")+'</div>'+
   panes.map(function(p,pi){return '<div role="tabpanel" id="gp'+pi+'" aria-labelledby="tab'+pi+'"'+(pi===gTab?'':' hidden')+'>'+p+'</div>';}).join("");
  [].forEach.call(elG.querySelectorAll("[data-tab]"),function(b){
    b.addEventListener("click",function(){
      gTab=+b.getAttribute("data-tab");
      [].forEach.call(elG.querySelectorAll("[data-tab]"),function(o){o.setAttribute("aria-selected",String(o===b));});
      [].forEach.call(elG.querySelectorAll("[role=tabpanel]"),function(p,pi){p.hidden=pi!==gTab;});
    });
  });
  document.getElementById("tLetter").textContent=teacherText();
  var gChild=document.getElementById("gChild"),gMe=document.getElementById("gMe"),gMath=document.getElementById("gMath"),
      gName=document.getElementById("gName"),gLike=document.getElementById("gLike"),evDate=document.getElementById("evDate"),
      rw=document.getElementById("reward"),gl=document.getElementById("goal");
  gChild.value=store.get("child","");gMe.value=store.get("parent","");gMath.value=store.get("maths","");gName.value=store.get("name","");
  gLike.value=store.get("interest","");evDate.value=store.get("evalDate","");
  rw.value=store.get("reward","Weekend treat");gl.value=goalStars();
  function paintLetter(){document.getElementById("tLetter").textContent=teacherText();}
  gName.addEventListener("input",function(){store.set("name",gName.value.trim());});
  gChild.addEventListener("input",function(){store.set("child",gChild.value.trim());paintLetter();});
  gMe.addEventListener("input",function(){store.set("parent",gMe.value.trim());paintLetter();});
  gMath.addEventListener("input",function(){store.set("maths",gMath.value.trim());paintLetter();});
  gLike.addEventListener("input",function(){store.set("interest",gLike.value.trim());});
  evDate.addEventListener("change",function(){store.set("evalDate",evDate.value);});
  rw.addEventListener("input",function(){store.set("reward",rw.value||"Weekend treat");});
  gl.addEventListener("change",function(){var v=parseInt(gl.value,10);if(isNaN(v))v=12;v=Math.max(3,Math.min(28,v));gl.value=v;store.set("goal",v);});
  document.getElementById("gback").addEventListener("click",goHome);
  var gt=document.getElementById("giveT");
  if(gt)gt.addEventListener("click",function(){store.set("claimed",store.get("claimed",0)+goalStars());renderGrown();});
  /* undoing a star also takes back the sticker that star earned */
  [].forEach.call(elG.querySelectorAll("[data-undo]"),function(b){
    b.addEventListener("click",function(){
      var all=days(),sid=b.getAttribute("data-undo");
      if(all[k]&&typeof all[k]==="object"){
        var e=all[k][sid];
        if(e&&e.k){var st=store.get("stickers",{});if(Number(e.f)>0)st[e.k]=Number(e.f);else delete st[e.k];store.set("stickers",st);}
        delete all[k][sid];store.set("days",all);
      }
      renderGrown();
    });
  });
  [].forEach.call(elG.querySelectorAll("[data-rmw]"),function(b){
    b.addEventListener("click",function(){var list=store.get("words",[]);list.splice(+b.getAttribute("data-rmw"),1);store.set("words",list);renderGrown();});
  });
  document.getElementById("sAdd").addEventListener("click",function(){
    var w=document.getElementById("sWhat").value.trim(),n=document.getElementById("sNote").value.trim();
    if(!w){document.getElementById("sWhat").focus();return;}
    var list=store.get("samples",[]);list.push({d:todayKey(),w:w,n:n});store.set("samples",list);
    renderGrown();document.getElementById("sList").scrollIntoView({block:"nearest"});
  });
  [].forEach.call(elG.querySelectorAll("[data-del]"),function(b){
    var armed=false,tm=null;
    b.addEventListener("click",function(){
      if(!armed){armed=true;b.textContent="Tap again to remove";tm=setTimeout(function(){armed=false;b.textContent="Remove";},3000);return;}
      clearTimeout(tm);var list=store.get("samples",[]);list.splice(+b.getAttribute("data-del"),1);store.set("samples",list);renderGrown();
    });
  });
  document.getElementById("sCopy").addEventListener("click",function(){
    var list=store.get("samples",[]);
    var text="Work samples"+(store.get("child","")?" for "+store.get("child",""):"")+"\n\n"+(list.length?list.map(function(s,i){return (i+1)+". "+s.d+": "+s.w+(s.n?"\n   Teacher's note: "+s.n:"");}).join("\n\n"):"(none yet)");
    copyText(text,document.getElementById("sSaid"),document.getElementById("sFb"));
  });
  document.getElementById("tCopy").addEventListener("click",function(){
    copyText(teacherText(),document.getElementById("tSaid"),document.getElementById("tFb"));
  });
  document.getElementById("bkCopy").addEventListener("click",function(){
    copyText(backupText(),document.getElementById("bkSaid"),document.getElementById("bkFb"));
  });
  document.getElementById("rsGo").addEventListener("click",function(){
    var ok=restoreFrom(document.getElementById("rsText").value.trim());
    if(ok){renderGrown();document.getElementById("rsMsg").textContent="Restored.";}
    else document.getElementById("rsMsg").textContent="That does not look like a backup from this page.";
  });
}

renderHome(true);
</script>

<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
